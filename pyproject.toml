# This file configures the StringZilla CPython bindings, which scikit-build-core compiles through `CMakeLists.txt`, and
# their wheels, which `cibuildwheel` builds:
#
#   stringzilla        CPython 3.10-3.14 and 3.14t (free-threaded)
#                      Linux `manylinux` + `musllinux` on x86_64, aarch64, i686, ppc64le, s390x,
#                      armv7l, riscv64; macOS x86_64 + arm64; Windows AMD64, x86, ARM64.
#
# Every wheel runs the full suite on the interpreter it was built for.
[build-system]
build-backend = "scikit_build_core.build"
requires = ["scikit-build-core>=0.10"]

[project]
authors = [{ email = "1983160+ashvardanian@users.noreply.github.com", name = "Ash Vardanian" }]
classifiers = [
  "Development Status :: 5 - Production/Stable",
  "Natural Language :: English",
  "Intended Audience :: Developers",
  "Intended Audience :: Information Technology",
  "Programming Language :: C++",
  "Programming Language :: Python :: 3 :: Only",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Programming Language :: Python :: 3.14",
  "Programming Language :: Python :: Implementation :: CPython",
  "Programming Language :: Python :: Implementation :: PyPy",
  "Operating System :: OS Independent",
  "Topic :: File Formats",
  "Topic :: Internet :: Log Analysis",
  "Topic :: Scientific/Engineering :: Information Analysis",
  "Topic :: System :: Logging",
  "Topic :: Text Processing :: General",
  "Topic :: Text Processing :: Indexing",
]
description = "Search, hash, sort, and process strings faster via SWAR and SIMD"
dynamic = ["version"]
license = { text = "Apache-2.0" }
name = "stringzilla"
readme = "README.md"
requires-python = ">=3.10"

[project.urls]
Homepage = "https://github.com/ashvardanian/StringZilla"

# The extension installs at the wheel's root as the `stringzilla` module, so no Python package rides along with it:
# `python/stringzilla` holds its C sources alone.
[tool.scikit-build]
build.targets = ["stringzilla_python"]
build-dir = "build_python/{wheel_tag}"
install.components = ["stringzilla_python"]
sdist.exclude = ["bench", "build*", "node_modules", "target", "test"]
wheel.packages = []

[tool.scikit-build.cmake.define]
STRINGZILLA_BUILD_PYTHON = "ON"
STRINGZILLA_BUILD_SHARED = "OFF"
STRINGZILLA_INSTALL = "OFF"
STRINGZILLA_TARGET_ARCH = { default = "", env = "STRINGZILLA_TARGET_ARCH" }

[tool.scikit-build.metadata.version]
input = "VERSION"
provider = "scikit_build_core.metadata.regex"
regex = "(?P<value>.+)"

[tool.pytest.ini_options]
# `test/` is flat modules that pytest imports by basename, so none may share a stdlib module's name, like
# `string`; `python_files` collects the `test_`-free filenames.
# `-p no:randomly` keeps `<PROJECT>_SEED` in charge wherever pytest-randomly happens to be installed.
addopts = ["-ra", "--showlocals", "--strict-markers", "--strict-config", "-p", "no:randomly"]
filterwarnings = ["error"]
markers = ["thread_unsafe: runs on one thread under pytest-run-parallel's --parallel-threads"]
minversion = "8.0"
python_files = ["*.py"]
testpaths = ["test"]
xfail_strict = true

# Packages the pytest suite validates against when they import and skips over when they do not. PEP 735
# groups, so they are development tooling: never published in wheel metadata, never installed by anyone
# consuming StringZilla, and reachable only through `pip install --group <name>`, which the CI jobs run
# rather than repeating the names. Rust spells the same idea as `[dev-dependencies]` in `Cargo.toml`.
# `test-oracles` stays out of `[tool.cibuildwheel] test-groups`, which installs on QEMU-emulated
# aarch64, ppc64le and s390x, where a missing wheel means compiling the oracle's own C under emulation.
# `pycryptodome` and `pyahocorasick` each ship their own C, so they are independent witnesses to the
# OpenSSL and the multi-pattern walk the C++ suite already compares against. `cupy` is not an oracle but
# a producer, sourcing `__cuda_array_interface__` buffers that are not the module's own `unified_array`.
[dependency-groups]
lint = ["ruff>=0.15.8"]
test = ["numpy>=1.21", "pytest>=8", "pytest-repeat>=0.9.4"]
# Free-threaded builds only report a race if several threads actually enter the extension at once.
test-parallel = ["pytest-run-parallel>=0.7"]
test-oracles = ["pycryptodome", "pyahocorasick", "pyarrow"]
test-cuda = ["cupy-cuda12x"]

[tool.black]
line-length = 120

[tool.cibuildwheel]
build-verbosity = 0
test-command = "python -X faulthandler -m pytest -x {project}/test"
test-groups = ["test"]

# We need to build for all platforms:
# - on Linux: x86_64, aarch64, i686, ppc64le, s390x
# - on MacOS: x86_64, arm64, universal2
# - on Windows: AMD64, x86, ARM64
# https://cibuildwheel.readthedocs.io/en/stable/options/#archs
#
# Important to note, not all those platforms have recent images.
# The `manylinux_2_28` seems to be missing for `i686`.
# The `i686` is 32-bit x86, and `x86_64` is 64-bit x86.
archs = ["all"]

# Add "pp*" to skip PyPy builds, but they should work fine these days :)
# https://cibuildwheel.readthedocs.io/en/stable/options/#build-skip
# https://cibuildwheel.readthedocs.io/en/stable/#what-does-it-do
skip = ["*-macos*_universal2"]

# In Docker containers `os.cpu_count()` reports the host's cores, and that many SIMD compile jobs OOM the container.
[tool.cibuildwheel.environment]
CMAKE_BUILD_PARALLEL_LEVEL = "2"

[tool.cibuildwheel.linux]
before-build = ["rm -rf {project}/build_python"]
repair-wheel-command = "auditwheel repair --lib-sdir . -w {dest_dir} {wheel}"

# Use more recent images for the most popular SIMD-capable CPU architectures, to have access to newer compilers.
# Otherwise, prepare yourself to all kinds of AVX-512 issues and other SIMD-related pain.
# You can keep track of the most recent images on Quay:
# - for `manylinux`: https://quay.io/search?q=manylinux
# - for `musllinux`: https://quay.io/search?q=musllinux
manylinux-aarch64-image = "manylinux_2_28"
manylinux-ppc64le-image = "manylinux_2_28"
manylinux-s390x-image = "manylinux_2_28"
manylinux-x86_64-image = "manylinux_2_28"
musllinux-aarch64-image = "musllinux_1_2"
musllinux-i686-image = "musllinux_1_2"
musllinux-ppc64le-image = "musllinux_1_2"
musllinux-s390x-image = "musllinux_1_2"
musllinux-x86_64-image = "musllinux_1_2"

# Different manylinux images use different package managers.
# Try yum (CentOS/RHEL), dnf (Fedora), or apt-get (Debian/Ubuntu).
before-all = ["""
    (yum update -y && yum install -y glibc-devel wget python3-devel) || \
    (dnf update -y && dnf install -y glibc-devel wget python3-devel) || \
    (apt-get update && apt-get install -y libc6-dev wget python3-dev)
    """]

# With `musl` builds, we obviously don't need the `glibc` and can't use `yum`.
# This may also be handy for using custom dependencies for different Python versions:
# https://cibuildwheel.readthedocs.io/en/stable/options/#overrides
[[tool.cibuildwheel.overrides]]
before-all = "apk add --update wget python3-dev"
select = "*-musllinux*"

[tool.cibuildwheel.macos]
archs = ["x86_64", "arm64"]
before-build = ["rm -rf {project}/build_python"]
repair-wheel-command = "delocate-wheel --require-archs {delocate_archs} -w {dest_dir} -v {wheel}"

[tool.cibuildwheel.windows]
before-build = ["rd /s /q {project}\\build_python || echo Done"]

# macOS: both arches share an 11.0 floor. The release jobs already force
# `MACOSX_DEPLOYMENT_TARGET=11.0`, so the x86_64 wheels were built against 11.0 while declaring
# 10.13 - this makes the declaration match what actually ships. Big Sur is also the first release
# to run on Apple Silicon, so a single number covers both arches without narrowing Intel support.
[[tool.cibuildwheel.overrides]]
environment.MACOSX_DEPLOYMENT_TARGET = "11.0"
inherit.environment = "append"
select = "*-macos*"

# A free-threaded interpreter is the only place a data race can surface, so its suite runs concurrently.
# Doctests sit out, asserting against a process-wide stdout capture that threads interleave.
[[tool.cibuildwheel.overrides]]
select = "cp3*t-*"
test-command = "python -X faulthandler -m pytest -x --parallel-threads=4 --ignore={project}/test/doctests.py {project}/test"
test-groups = ["test", "test-parallel"]

[tool.ruff]
extend-select = [
  "E", # pycodestyle errors
  "F", # pyflakes
  "I", # isort
  "TID", # flake8-tidy-imports
]
line-length = 120
target-version = "py310"

[tool.ruff.lint.flake8-tidy-imports]
ban-relative-imports = "all"

[tool.ruff.lint.isort]
known-first-party = ["stringzilla"]
combine-as-imports = true
