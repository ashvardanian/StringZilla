name: Release C

on:
  release:
    types: [published]

permissions:
  contents: read

env:
  WASI_SDK_VERSION: "34"

jobs:
  hooks:
    name: Check Release Commit
    runs-on: ubuntu-26.04
    timeout-minutes: 5
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v7
      - name: Check the Release Commit
        run: .github/scripts/check-release.sh "$GITHUB_REF_NAME"

  create_linux_deb_package:
    name: Create Debian Package for ${{ matrix.arch }} ${{ matrix.target }}
    needs: hooks
    permissions:
      contents: write
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    env:
      CC: clang-20
      CXX: clang++-20
      AR: llvm-ar-20
      NM: llvm-nm-20
      RANLIB: llvm-ranlib-20
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: amd64
            target: x86_64-linux-gnu
          - arch: arm64
            target: aarch64-linux-gnu
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v7
      - name: Get Version
        id: set_version
        run: echo "version=$(cat VERSION)" >> $GITHUB_OUTPUT
      - name: Install Dependencies
        run: |
          curl -fsSL https://apt.llvm.org/llvm-snapshot.gpg.key \
            | sudo gpg --dearmor -o /usr/share/keyrings/llvm.gpg
          echo "deb [signed-by=/usr/share/keyrings/llvm.gpg] http://apt.llvm.org/noble/ llvm-toolchain-noble-20 main" \
            | sudo tee /etc/apt/sources.list.d/llvm.list > /dev/null
          sudo apt-get update
          sudo apt-get install -y clang-20 lld-20 make crossbuild-essential-arm64
      - name: Build Shared Library
        run: |
          cmake --preset release_shared \
            -D CMAKE_C_COMPILER_TARGET=${{ matrix.target }} \
            -D CMAKE_CXX_COMPILER_TARGET=${{ matrix.target }} \
            -D CMAKE_SHARED_LINKER_FLAGS="-fuse-ld=lld-20" \
            -D CMAKE_SYSTEM_NAME=Linux \
            -D CMAKE_SYSTEM_PROCESSOR=${{ matrix.arch }}
          cmake --build --preset release_shared
          cp build_release_shared/libstringzilla_shared.so \
            "stringzilla_linux_${{ matrix.arch }}_${{ steps.set_version.outputs.version }}.so"
      - name: Package Debian Archive
        run: |
          DEB_DIR="stringzilla_linux_${{ matrix.arch }}_${{ steps.set_version.outputs.version }}"
          mkdir -p "${DEB_DIR}/DEBIAN"
          mkdir -p "${DEB_DIR}/usr/local/lib"
          mkdir -p "${DEB_DIR}/usr/local/include/stringzilla"
          mkdir -p "${DEB_DIR}/usr/local/share/doc/stringzilla"
          cp build_release_shared/libstringzilla_shared.so build_release_shared/libstringzilla_static.a "${DEB_DIR}/usr/local/lib/"
          cp -r c/stringzilla/* include/stringzilla/* cpp/stringzilla/* "${DEB_DIR}/usr/local/include/stringzilla/"
          cp LICENSE "${DEB_DIR}/usr/local/share/doc/stringzilla/"
          cat > "${DEB_DIR}/DEBIAN/control" <<CTRL
          Package: stringzilla
          Version: ${{ steps.set_version.outputs.version }}
          Maintainer: Ash Vardanian
          Architecture: ${{ matrix.arch }}
          Description: Search, hash, sort, fingerprint, and fuzzy-match strings faster via SWAR, SIMD, and GPGPU
          CTRL
          sed -i 's/^          //' "${DEB_DIR}/DEBIAN/control"
          dpkg-deb --build "${DEB_DIR}"
      - name: Upload to GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release upload ${{ github.event.release.tag_name }} *.so *.deb --clobber

  create_windows_dll_library:
    name: Create Library for Windows ${{ matrix.arch }} with ${{ matrix.preset }}
    needs: hooks
    permissions:
      contents: write
    runs-on: windows-2025
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        include:
          - { arch: x64, preset: msvc2026_x64 }
          - { arch: arm64, preset: msvc2022_arm64 }
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v7
      - name: Set Up MSVC
        uses: microsoft/setup-msbuild@v3
      # Newest CMake, so it knows whichever Visual Studio the image ships.
      - name: Set Up CMake
        uses: lukka/get-cmake@latest
      - name: Get Version
        id: set_version
        shell: bash
        run: echo "version=$(cat VERSION)" >> $GITHUB_OUTPUT
      - name: Build Shared Library
        run: |
          cmake --preset ${{ matrix.preset }} -D STRINGZILLA_BUILD_TEST=OFF
          cmake --build --preset ${{ matrix.preset }}
      # MSVC links a DLL through its import library, so the archive carries both.
      - name: Package Archive
        shell: bash
        run: |
          tar -czf "stringzilla_windows_${{ matrix.arch }}_${{ steps.set_version.outputs.version }}.tar.gz" \
            build_${{ matrix.preset }}/Release/stringzilla_shared.dll \
            build_${{ matrix.preset }}/Release/stringzilla_shared.lib \
            build_${{ matrix.preset }}/Release/stringzilla_static.lib \
            c/stringzilla/ include/stringzilla/ cpp/stringzilla/ \
            LICENSE
      - name: Upload to GitHub Release
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release upload ${{ github.event.release.tag_name }} "stringzilla_windows_${{ matrix.arch }}_${{ steps.set_version.outputs.version }}.tar.gz" --clobber

  create_macos_dylib_library:
    name: Create Library for macOS ${{ matrix.arch }}
    needs: hooks
    permissions:
      contents: write
    runs-on: macos-26
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        arch: [arm64, x86_64]
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v7
      - name: Get Version
        id: set_version
        run: echo "version=$(cat VERSION)" >> $GITHUB_OUTPUT
      - name: Build Shared Library
        run: |
          cmake --preset release_shared -D CMAKE_OSX_ARCHITECTURES=${{ matrix.arch }}
          cmake --build --preset release_shared
          cp build_release_shared/libstringzilla_shared.dylib \
            "stringzilla_macos_${{ matrix.arch }}_${{ steps.set_version.outputs.version }}.dylib"
          zip -r "stringzilla_macos_${{ matrix.arch }}_${{ steps.set_version.outputs.version }}.zip" \
            build_release_shared/libstringzilla_shared.dylib build_release_shared/libstringzilla_static.a \
            c/stringzilla/ include/stringzilla/ cpp/stringzilla/ LICENSE
      - name: Upload to GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release upload ${{ github.event.release.tag_name }} *.dylib *.zip --clobber

  create_android_library:
    name: Create Library for Android ${{ matrix.arch }} with ${{ matrix.preset }}
    needs: hooks
    permissions:
      contents: write
    runs-on: ubuntu-26.04
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        include:
          - preset: android_arm64
            arch: arm64
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v7
      - name: Get Version
        id: set_version
        run: echo "version=$(cat VERSION)" >> $GITHUB_OUTPUT
      - name: Build Shared Library
        run: |
          export ANDROID_NDK_ROOT="${ANDROID_NDK_LATEST_HOME}"
          cmake --preset ${{ matrix.preset }}
          cmake --build --preset ${{ matrix.preset }}
      - name: Package Archive
        run: |
          zip -r "stringzilla_android_${{ matrix.arch }}_${{ steps.set_version.outputs.version }}.zip" \
            build_${{ matrix.preset }}/libstringzilla_shared.so c/stringzilla/ include/stringzilla/ cpp/stringzilla/ LICENSE
      - name: Upload to GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release upload ${{ github.event.release.tag_name }} *.zip --clobber

  # The static archive and headers for C and Rust callers that link their own WASI module.
  create_wasi_library:
    name: Create Library for ${{ matrix.os }} wasm32 ${{ matrix.simd }} with ${{ matrix.preset }}
    needs: hooks
    permissions:
      contents: write
    runs-on: ubuntu-26.04
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: wasi
            preset: wasm32_wasi
            simd: v128
          - os: wasi
            preset: wasm32_wasi
            simd: v128relaxed
          - os: wasi-threads
            preset: wasm32_wasi_threads
            simd: v128relaxed
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v7
      - name: Get Version
        id: set_version
        run: echo "version=$(cat VERSION)" >> $GITHUB_OUTPUT
      - name: Install WASI SDK
        run: |
          curl -sSL "https://github.com/WebAssembly/wasi-sdk/releases/download/wasi-sdk-${WASI_SDK_VERSION}/wasi-sdk-${WASI_SDK_VERSION}.0-x86_64-linux.tar.gz" \
            | tar xz -C "$HOME"
          echo "WASI_SDK_PATH=$HOME/wasi-sdk-${WASI_SDK_VERSION}.0-x86_64-linux" >> "$GITHUB_ENV"
      - name: Build Static Library
        run: |
          cmake --preset ${{ matrix.preset }} -D WASI_SDK_PREFIX="${WASI_SDK_PATH}" -D STRINGZILLA_MARCH=${{ matrix.simd }}
          cmake --build build_${{ matrix.preset }} --target stringzilla_static
      - name: Package Archive
        run: |
          zip -r "stringzilla_${{ matrix.os }}_wasm32-${{ matrix.simd }}_${{ steps.set_version.outputs.version }}.zip" \
            build_${{ matrix.preset }}/libstringzilla_static.a c/stringzilla/ include/stringzilla/ cpp/stringzilla/ LICENSE
      - name: Upload to GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release upload ${{ github.event.release.tag_name }} *.zip --clobber
