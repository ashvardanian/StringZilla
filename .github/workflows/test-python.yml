name: Test Python

on:
  workflow_call:

permissions:
  contents: read

env:
  PYTHONUTF8: 1
  PYTHONFAULTHANDLER: 1

jobs:
  test_python:
    name: Test Python ${{ matrix.python-version }} on ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        # Architecture comes from the runner label, not a matrix axis.
        os: [ubuntu-26.04, ubuntu-26.04-arm, macos-26, windows-2025, windows-11-arm]
        python-version: ["3.15", "3.12"]
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v7
      - name: Set Up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}
      - name: Build Locally
        env:
          MACOSX_DEPLOYMENT_TARGET: "11.0"
        run: |
          python -m pip install --upgrade pip
          python -m pip install --group test ${{ runner.os != 'Windows' && '--group test-oracles' || '' }} .
      - name: Test with PyTest
        run: python -X faulthandler -m pytest -x

  test_python_debug:
    name: Test Python Debug Build on Ubuntu
    runs-on: ubuntu-26.04
    timeout-minutes: 30
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v7
      - name: Set Up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.13"
      - name: Build with Asserts
        run: |
          python -m pip install --upgrade pip
          python -m pip install --group test --group test-oracles . -C cmake.build-type=Debug
      - name: Test with PyTest
        run: python -X faulthandler -m pytest -x

  test_python_alpine:
    name: Test Python on Alpine Linux
    runs-on: ubuntu-26.04
    timeout-minutes: 30
    container:
      image: alpine:latest
    steps:
      - name: Install Git for Checkout
        run: apk add --no-cache git ca-certificates bash
      - name: Checkout Repository
        uses: actions/checkout@v7
      - name: Build Locally
        run: |
          apk add cmake samurai g++ gcc python3 py3-pip python3-dev
          python3 -m pip install --break-system-packages --upgrade pip
          python3 -m pip install --break-system-packages --group test .
      - name: Test with PyTest
        run: python3 -X faulthandler -m pytest -x

  # The native Python builds on every OS fail in minutes, before dozens of cibuildwheel jobs start.
  wheels:
    name: Build Python Wheels
    needs: test_python
    uses: ./.github/workflows/build-wheels.yml
    with:
      smoke: true
