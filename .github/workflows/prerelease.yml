name: "Pre-Release"

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main*"]

# One group per source branch, so a `main*` branch with an open PR is not built twice - `push` no longer
# matches it, and `head_ref` folds any number of PRs from that branch into the same group. Superseded PR
# runs are cancelled; `main` runs are not, so a build feeding the release pipeline is never killed midway.
concurrency:
  group: ${{ github.workflow }}-${{ github.head_ref || github.ref_name }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  BUILD_TYPE: Release
  GH_TOKEN: ${{ secrets.SEMANTIC_RELEASE_TOKEN }}
  PYTHON_VERSION: 3.13
  PYTHONUTF8: 1
  WASI_SDK_VERSION: "34"
  # Pinned to the 36 LTS line so the wasm rows run a reproducible engine.
  WASMTIME_VERSION: v36.0.15

# Sets permissions of the GITHUB_TOKEN to allow deployment to GitHub Pages
permissions:
  contents: read

jobs:
  versioning:
    name: Update Version
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0
          fetch-tags: true
          persist-credentials: false
      - name: Run TinySemVer
        uses: ashvardanian/tinysemver@v3
        with:
          verbose: "true"
          version-file: "VERSION"
          update-version-in: |
            Cargo.toml:^version = "(\d+\.\d+\.\d+)"
            package.json:"version": "(\d+\.\d+\.\d+)"
            package.json:"@stringzilla/darwin-arm64": "(\d+\.\d+\.\d+)"
            package.json:"@stringzilla/darwin-x64": "(\d+\.\d+\.\d+)"
            package.json:"@stringzilla/linux-arm64": "(\d+\.\d+\.\d+)"
            package.json:"@stringzilla/linux-x64": "(\d+\.\d+\.\d+)"
            package.json:"@stringzilla/win32-arm64": "(\d+\.\d+\.\d+)"
            package.json:"@stringzilla/win32-x64": "(\d+\.\d+\.\d+)"
            javascript/@stringzilla-darwin-arm64/package.json:"version": "(\d+\.\d+\.\d+)"
            javascript/@stringzilla-darwin-x64/package.json:"version": "(\d+\.\d+\.\d+)"
            javascript/@stringzilla-linux-arm64/package.json:"version": "(\d+\.\d+\.\d+)"
            javascript/@stringzilla-linux-x64/package.json:"version": "(\d+\.\d+\.\d+)"
            javascript/@stringzilla-win32-arm64/package.json:"version": "(\d+\.\d+\.\d+)"
            javascript/@stringzilla-win32-x64/package.json:"version": "(\d+\.\d+\.\d+)"
            CMakeLists.txt:VERSION (\d+\.\d+\.\d+)
            CITATION.cff:^version: (\d+\.\d+\.\d+)
            StringZilla.csproj:<Version>(\d+\.\d+\.\d+)</Version>
            pom.xml:<artifactId>stringzilla</artifactId>\n  <version>(\d+\.\d+\.\d+)</version>
          update-major-version-in: |
            include/stringzilla/stringzilla.h:^#define STRINGZILLA_H_VERSION_MAJOR (\d+)
          update-minor-version-in: |
            include/stringzilla/stringzilla.h:^#define STRINGZILLA_H_VERSION_MINOR (\d+)
          update-patch-version-in: |
            include/stringzilla/stringzilla.h:^#define STRINGZILLA_H_VERSION_PATCH (\d+)
          dry-run: "true"

  test_ubuntu_gcc:
    name: Ubuntu GCC 12 - ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-22.04, ubuntu-22.04-arm]
    env:
      CC: gcc-12
      CXX: g++-12

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Log hardware capabilities
        run: |
          lscpu
          echo ""
          echo "CPU Info:"
          grep -E "model name|flags" /proc/cpuinfo | head -5 || true

        # C/C++
        # If the compilation fails, we want to log the compilation commands in addition to
        # the standard output.
      - name: Install dependencies
        run: |
          sudo apt update
          sudo apt install -y cmake build-essential gcc-12 g++-12

      - name: Build C/C++
        run: |
          cmake -B build_artifacts \
            -DCMAKE_BUILD_TYPE=RelWithDebInfo \
            -DCMAKE_EXPORT_COMPILE_COMMANDS=1 \
            -DSTRINGZILLA_BUILD_BENCHMARK=1 \
            -DSTRINGZILLA_BUILD_TEST=1

          cmake --build build_artifacts --config RelWithDebInfo > build_artifacts/logs.txt 2>&1 || {
            echo "Compilation failed. Here are the logs:"
            cat build_artifacts/logs.txt
            echo "The original compilation commands:"
            cat build_artifacts/compile_commands.json
            echo "GCC Version:"
            gcc-12 --version
            echo "G++ Version:"
            g++-12 --version
            exit 1
          }
      - name: Test C++
        run: build_artifacts/stringzilla_test_cpp20
      - name: Check stringzilla_bare is built correctly
        run: test -z "$(ldd build_artifacts/libstringzilla_bare.so | grep '.so')"
      - name: Build shared library for Go binding
        run: |
          cmake -B build_shared -DCMAKE_BUILD_TYPE=RelWithDebInfo -DSTRINGZILLA_BUILD_SHARED=1
          cmake --build build_shared --target stringzilla_shared --config RelWithDebInfo
      - name: Set up Go
        uses: actions/setup-go@v7
        with:
          go-version: ">=1.24"
          cache: false
      - name: Test Go binding
        working-directory: golang
        env:
          LD_LIBRARY_PATH: ${{ github.workspace }}/build_shared
        run: go test -v -tags no_sha256 # Skip SHA tests for GCC
      - name: Test on Real World Data
        run: |
          build_artifacts/stringzilla_bench_memory_cpp20 ${DATASET_PATH}     # for string copies and fills
          build_artifacts/stringzilla_bench_find_cpp20 ${DATASET_PATH}       # for substring search
          build_artifacts/stringzilla_bench_token_cpp20 ${DATASET_PATH}      # for hashing, equality comparisons, etc.
          build_artifacts/stringzilla_bench_sequence_cpp20 ${DATASET_PATH}   # for sorting arrays of strings
          build_artifacts/stringzilla_bench_container_cpp20 ${DATASET_PATH}  # for STL containers with string keys
        env:
          DATASET_PATH: ./README.md
        # Don't overload GitHub with our benchmarks.
        # The results in such an unstable environment will be meaningless anyway.
        if: 0

        # Python
      - name: Set up Python ${{ env.PYTHON_VERSION }}
        uses: actions/setup-python@v7
        with:
          python-version: ${{ env.PYTHON_VERSION }}
      - name: Build Python
        run: |
          python -m pip install --upgrade pip
          pip install pytest pytest-repeat numpy pyarrow
          python -m pip install .
      - name: Log Python capabilities
        run: |
          python - << 'PY'
          import platform
          import stringzilla as sz
          print("platform:", platform.platform())
          print("machine:", platform.machine(), "processor:", platform.processor())
          print("stringzilla.__capabilities__:", sz.__capabilities__)
          PY
      - name: Test Python
        run: python -X faulthandler -m pytest test/ -s -vv --maxfail=1 --full-trace

        # JavaScript
      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 22
      - name: Build and test JavaScript
        run: npm install && npm test

      # Rust
      - name: Set up Rust
        uses: dtolnay/rust-toolchain@stable
      - name: Test Rust with dynamic dispatch
        run: cargo test --release
      - name: Test Rust with compile-time dispatch
        run: cargo test --release --no-default-features --features std
      - name: Test Rust no_std
        run: cargo test --release --no-default-features
        # Otherwise `cargo publish` is the first thing that ever reads the `include` list.
      - name: Package the crate
        run: cargo package --locked

  test_ubuntu_clang:
    name: Ubuntu Clang 16 - ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-22.04, ubuntu-22.04-arm]
    env:
      CC: clang-16
      CXX: clang++-16

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Log hardware capabilities
        run: |
          lscpu
          echo ""
          echo "CPU Info:"
          grep -E "model name|flags" /proc/cpuinfo | head -5 || true

        # C/C++
        # Clang 16 isn't available from default repos on Ubuntu 22.04, so we have to install it manually
      - name: Install dependencies
        run: |
          sudo apt update
          sudo apt install -y cmake build-essential libjemalloc-dev
          wget https://apt.llvm.org/llvm.sh
          chmod +x llvm.sh
          sudo ./llvm.sh 16

      - name: Build C/C++
        run: |
          cmake -B build_artifacts \
            -DCMAKE_BUILD_TYPE=RelWithDebInfo \
            -DCMAKE_EXPORT_COMPILE_COMMANDS=1 \
            -DSTRINGZILLA_BUILD_BENCHMARK=1 \
            -DSTRINGZILLA_BUILD_TEST=1

          cmake --build build_artifacts --config RelWithDebInfo > build_artifacts/logs.txt 2>&1 || {
            echo "Compilation failed. Here are the logs:"
            cat build_artifacts/logs.txt
            echo "The original compilation commands:"
            cat build_artifacts/compile_commands.json
            echo "Clang Version:"
            clang-16 --version
            echo "Clang++ Version:"
            clang++-16 --version
            exit 1
          }
      - name: Test C++
        run: build_artifacts/stringzilla_test_cpp20
      - name: Check stringzilla_bare is built correctly
        run: test -z "$(ldd build_artifacts/libstringzilla_bare.so | grep '.so')"
      - name: Build shared library for Go binding
        run: |
          cmake -B build_shared -DCMAKE_BUILD_TYPE=RelWithDebInfo -DSTRINGZILLA_BUILD_SHARED=1
          cmake --build build_shared --target stringzilla_shared --config RelWithDebInfo
      - name: Set up Go
        uses: actions/setup-go@v7
        with:
          go-version: ">=1.24"
          cache: false
      - name: Test Go binding
        working-directory: golang
        env:
          LD_LIBRARY_PATH: ${{ github.workspace }}/build_shared
        run: go test -v
      - name: Test on Real World Data
        run: |
          build_artifacts/stringzilla_bench_find_cpp20 ${DATASET_PATH}      # for substring search
          build_artifacts/stringzilla_bench_token_cpp20 ${DATASET_PATH}     # for hashing, equality comparisons, etc.
          build_artifacts/stringzilla_bench_sequence_cpp20 ${DATASET_PATH}  # for sorting arrays of strings
          build_artifacts/stringzilla_bench_container_cpp20 ${DATASET_PATH} # for STL containers with string keys
        env:
          DATASET_PATH: ./README.md
        # Don't overload GitHub with our benchmarks.
        # The results in such an unstable environment will be meaningless anyway.
        if: 0

        # Python
      - name: Set up Python ${{ env.PYTHON_VERSION }}
        uses: actions/setup-python@v7
        with:
          python-version: ${{ env.PYTHON_VERSION }}
      - name: Build Python
        run: |
          python -m pip install --upgrade pip
          pip install pytest pytest-repeat numpy pyarrow
          python -m pip install .
      - name: Log Python capabilities
        run: |
          python - << 'PY'
          import platform
          import stringzilla as sz
          print("platform:", platform.platform())
          print("machine:", platform.machine(), "processor:", platform.processor())
          print("stringzilla.__capabilities__:", sz.__capabilities__)
          PY
      - name: Test Python
        run: python -X faulthandler -m pytest test/ -s -vv --maxfail=1 --full-trace

        # Rust
      - name: Set up Rust
        uses: dtolnay/rust-toolchain@stable
      - name: Test Rust with dynamic dispatch
        run: cargo test --release
      - name: Test Rust with compile-time dispatch
        run: cargo test --release --no-default-features --features std
      - name: Test Rust no_std
        run: cargo test --release --no-default-features

  test_ubuntu_cuda:
    name: Ubuntu CUDA
    runs-on: ubuntu-22.04
    env:
      CC: gcc-12
      CXX: g++-12

    steps:
      - name: Checkout
        uses: actions/checkout@v7

        # Install CUDA Toolkit
      - name: Install CUDA Toolkit
        uses: Jimver/cuda-toolkit@v0.2.36
        with:
          cuda: "12.9.1"
          method: "network"

      - name: Log hardware capabilities
        run: |
          lscpu
          echo ""
          echo "CPU Info:"
          grep -E "model name|flags" /proc/cpuinfo | head -5 || true
          echo ""
          echo "GPU Info:"
          nvcc --version 2>/dev/null || echo "nvcc not yet installed"
          nvidia-smi 2>/dev/null || echo "nvidia-smi not yet available"

        # C/C++
      - name: Install dependencies
        run: |
          sudo apt update
          sudo apt install -y cmake build-essential gcc-12 g++-12

      - name: Build C/C++ with CUDA
        run: |
          # Note: Using Release build type instead of RelWithDebInfo
          # Optimized debugging not supported in CUDA and results in PTXAS fatal errors
          cmake -B build_artifacts \
            -DCMAKE_BUILD_TYPE=Release \
            -DCMAKE_EXPORT_COMPILE_COMMANDS=1 \
            -DSTRINGZILLA_BUILD_BENCHMARK=1 \
            -DSTRINGZILLA_BUILD_TEST=1

          cmake --build build_artifacts --config Release > build_artifacts/logs.txt 2>&1 || {
            echo "Compilation failed. Here are the logs:"
            cat build_artifacts/logs.txt
            echo "The original compilation commands:"
            cat build_artifacts/compile_commands.json
            echo "CUDA Version:"
            nvcc --version
            echo "GCC Version:"
            gcc-12 --version
            echo "G++ Version:"
            g++-12 --version
            exit 1
          }
      - name: Test C++
        run: build_artifacts/stringzilla_test_cpp20
      - name: Check stringzilla_bare is built correctly
        run: test -z "$(ldd build_artifacts/libstringzilla_bare.so | grep '.so')"

  test_ubuntu_swift:
    name: Swift on Linux ${{ matrix.arch }}
    runs-on: ${{ matrix.arch == 'arm64' && 'ubuntu-24.04-arm' || 'ubuntu-24.04' }}
    container: swift:6.4
    strategy:
      fail-fast: false
      matrix:
        arch: [x86_64, arm64]
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Log hardware capabilities
        run: |
          lscpu || true
          echo ""
          echo "CPU Info:"
          grep -E "model name|flags" /proc/cpuinfo | head -5 || true

      - name: Test Swift
        run: swift test

  test_ubuntu_dotnet:
    name: C# on Linux
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Install build tools
        run: |
          sudo apt update
          sudo apt install -y cmake build-essential

      - name: Build shared library
        run: |
          cmake -B build_shared -DCMAKE_BUILD_TYPE=Release -DSTRINGZILLA_BUILD_SHARED=1
          cmake --build build_shared --target stringzilla_shared --config Release

        # The runtime resolver probes runtimes/{rid}/native first; the shared target emits
        # libstringzilla_shared.so, so copy it under the name the binding looks up.
      - name: Stage native library
        run: |
          mkdir -p csharp/runtimes/linux-x64/native
          cp -L build_shared/libstringzilla_shared.so csharp/runtimes/linux-x64/native/libstringzilla.so

      - name: Set up .NET
        uses: actions/setup-dotnet@v6
        with:
          dotnet-version: 8.0.x

      - name: Check formatting
        run: |
          dotnet format StringZilla.csproj --verify-no-changes
          dotnet format csharp/StringZillaTests.csproj --verify-no-changes

      - name: Test C#
        run: dotnet test csharp/StringZillaTests.csproj -c Release --nologo

  test_ubuntu_java:
    name: Java on Linux
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Install build tools
        run: |
          sudo apt update
          sudo apt install -y cmake build-essential

      - name: Build shared library
        run: |
          cmake -B build_shared -DCMAKE_BUILD_TYPE=Release -DSTRINGZILLA_BUILD_SHARED=1
          cmake --build build_shared --target stringzilla_shared --config Release

        # NativeLoader extracts /native/{os}-{arch}/libstringzilla.so from the classpath at runtime;
        # Maven copies src/main/resources into target/classes before the tests run.
      - name: Stage native library
        run: |
          mkdir -p java/src/main/resources/native/linux-x86_64
          cp -L build_shared/libstringzilla_shared.so java/src/main/resources/native/linux-x86_64/libstringzilla.so

        # JDK 23: finalized Foreign Function & Memory API (since 22) and Palantir Java Format (needs <= 23).
      - name: Set up JDK
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "23"
          cache: maven

      - name: Check formatting
        run: mvn -B spotless:check

      - name: Test Java
        run: mvn -B test

  # Cross-compile the static test executables once per target architecture and publish them as artifacts. The
  # actual execution under QEMU happens in `test_cross_qemu`, which fans the vector-length-agnostic RISC-V
  # binary across several VLENs WITHOUT recompiling it.
  test_cross_linux:
    name: Cross Compile ${{ matrix.arch }} to ${{ matrix.target_arch }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-24.04
            arch: x86-64
            target_arch: aarch64
            target: aarch64-linux-gnu
            target_processor: arm64
            cross_package: crossbuild-essential-arm64
            cflags: ""
            file_id: aarch64 # substring `file` prints for this ELF
          - os: ubuntu-24.04-arm
            arch: aarch64
            target_arch: x86-64
            target: x86_64-linux-gnu
            target_processor: amd64
            cross_package: crossbuild-essential-amd64
            cflags: ""
            file_id: x86-64
          - os: ubuntu-24.04
            arch: x86-64
            target_arch: riscv64
            target: riscv64-linux-gnu
            target_processor: riscv64
            cross_package: crossbuild-essential-riscv64
            cflags: "-march=rv64gcv"
            file_id: RISC-V # `file` prints "UCB RISC-V", not "riscv64"
          - os: ubuntu-24.04
            arch: x86-64
            target_arch: loongarch64
            target: loongarch64-linux-gnu
            target_processor: loong64
            cross_package: g++-13-loongarch64-linux-gnu
            cflags: "-mlasx"
            file_id: LoongArch
          - os: ubuntu-24.04
            arch: x86-64
            target_arch: ppc64le
            target: powerpc64le-linux-gnu
            target_processor: ppc64el
            cross_package: crossbuild-essential-ppc64el
            cflags: "-mcpu=power9"
            file_id: PowerPC

    env:
      CC: clang-20
      CXX: clang++-20
      AR: llvm-ar-20
      NM: llvm-nm-20
      RANLIB: llvm-ranlib-20

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Log hardware capabilities
        run: |
          echo "Cross-Compilation: ${{ matrix.arch }} → ${{ matrix.target_arch }}"
          lscpu
          echo ""
          echo "CPU Info:"
          grep -E "model name|flags" /proc/cpuinfo | head -5 || true

      - name: Install cross-compilation toolchain
        run: |
          sudo apt-get update
          sudo apt-get install -y make build-essential ${{ matrix.cross_package }}
          wget https://apt.llvm.org/llvm.sh
          chmod +x llvm.sh
          sudo ./llvm.sh 20

      - name: Build C/C++ for ${{ matrix.target_arch }}
        run: |
          # Static-link the test/benchmark executables so QEMU user-mode can run them without juggling the
          # cross dynamic loader + sysroot library paths. `clang` drives the GNU linker directly and does not
          # add `-lstdc++` on its own, so we point it at the cross libstdc++ and pull it in explicitly.
          gcc_libdir=$(dirname "$(find /usr/lib/gcc-cross/${{ matrix.target }} -name 'libstdc++.a' 2>/dev/null | head -1)")
          cmake -B build_artifacts \
            -DCMAKE_BUILD_TYPE=RelWithDebInfo \
            -DCMAKE_EXPORT_COMPILE_COMMANDS=1 \
            -DCMAKE_C_COMPILER_TARGET=${{ matrix.target }} \
            -DCMAKE_CXX_COMPILER_TARGET=${{ matrix.target }} \
            -DCMAKE_SYSTEM_NAME=Linux \
            -DCMAKE_SYSTEM_PROCESSOR=${{ matrix.target_processor }} \
            -DCMAKE_C_FLAGS="${{ matrix.cflags }}" \
            -DCMAKE_CXX_FLAGS="${{ matrix.cflags }}" \
            -DCMAKE_EXE_LINKER_FLAGS="-static -L${gcc_libdir} -lstdc++ -lm" \
            -DSTRINGZILLA_BUILD_SHARED=1 \
            -DSTRINGZILLA_BUILD_BENCHMARK=1 \
            -DSTRINGZILLA_BUILD_TEST=1

          cmake --build build_artifacts --config RelWithDebInfo

      - name: Verify ${{ matrix.target_arch }} binaries
        run: |
          test -e build_artifacts/libstringzilla_bare.so
          test -e build_artifacts/libstringzilla_shared.so
          test -e build_artifacts/stringzilla_test_cpp20
          file build_artifacts/stringzilla_test_cpp20 | grep -q "${{ matrix.file_id }}"
          echo "✓ ${{ matrix.target_arch }} binaries built successfully"

      - name: Upload ${{ matrix.target_arch }} test binaries
        uses: actions/upload-artifact@v7
        with:
          name: cross-tests-${{ matrix.target_arch }}
          path: build_artifacts/stringzilla*_test_*
          if-no-files-found: error
          retention-days: 1

  # Run the cross-compiled (static) test binaries under QEMU user-mode. Build-and-verify alone never exercised
  # the SIMD kernels. Each row is its own pass/fail status; RVV/SVE are vector-length-agnostic, so the RISC-V
  # binary built once above is swept across VLEN 128/256/512 here (`-cpu rv64,v=true,vlen=N`) with no rebuild —
  # a single width under-tests VLA code.
  test_cross_qemu:
    name: QEMU Tests ${{ matrix.target_arch }}${{ matrix.variant }}
    needs: test_cross_linux
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        include:
          # ARM is vector-length-agnostic under SVE just like RISC-V, so the one binary is run NEON-only
          # (`sve=off`, else dynamic dispatch always prefers SVE2 and NEON is never exercised) plus SVE at
          # 128/256/512-bit (`sve-max-vq` = VL/128).
          - target_arch: aarch64
            qemu: qemu-aarch64-static
            qemu_cpu: "max,sve=off"
            variant: " @ neon"
          - target_arch: aarch64
            qemu: qemu-aarch64-static
            qemu_cpu: "max,sve-max-vq=1"
            variant: " @ sve=128"
          - target_arch: aarch64
            qemu: qemu-aarch64-static
            qemu_cpu: "max,sve-max-vq=2"
            variant: " @ sve=256"
          - target_arch: aarch64
            qemu: qemu-aarch64-static
            qemu_cpu: "max,sve-max-vq=4"
            variant: " @ sve=512"
          - target_arch: x86-64
            qemu: qemu-x86_64-static
            qemu_cpu: max
            variant: ""
          - target_arch: riscv64
            qemu: qemu-riscv64-static
            qemu_cpu: "rv64,v=true,vlen=128"
            variant: " @ vlen=128"
          - target_arch: riscv64
            qemu: qemu-riscv64-static
            qemu_cpu: "rv64,v=true,vlen=256"
            variant: " @ vlen=256"
          - target_arch: riscv64
            qemu: qemu-riscv64-static
            qemu_cpu: "rv64,v=true,vlen=512"
            variant: " @ vlen=512"
          - target_arch: loongarch64
            qemu: qemu-loongarch64-static
            qemu_cpu: la464
            variant: ""
          - target_arch: ppc64le
            qemu: qemu-ppc64le-static
            qemu_cpu: power9
            variant: ""

    steps:
      - name: Install QEMU user-mode
        run: |
          sudo apt-get update
          sudo apt-get install -y qemu-user-static

      - name: Download ${{ matrix.target_arch }} test binaries
        uses: actions/download-artifact@v8
        with:
          name: cross-tests-${{ matrix.target_arch }}
          path: tests

      - name: Run tests under QEMU for ${{ matrix.target_arch }}${{ matrix.variant }}
        timeout-minutes: 150
        env:
          # User-mode emulation runs the fuzz loops 20-40x slower than native hardware; the full
          # iteration budget needs over six hours per variant and the jobs die at the runner
          # timeout without ever reaching the later test families. A scaled-down budget still
          # sweeps every backend and vector length within the job limits.
          SZ_TESTS_MULTIPLIER: "0.05"
        run: |
          set -euo pipefail
          chmod +x tests/*
          for test_binary in $(find tests -type f -name 'stringzilla*_test_*' | sort); do
            echo "▶ ${{ matrix.qemu }} -cpu ${{ matrix.qemu_cpu }} ${test_binary}"
            ${{ matrix.qemu }} -cpu "${{ matrix.qemu_cpu }}" "${test_binary}"
          done

  test_wasm:
    name: WebAssembly wasm32-wasip1 ${{ matrix.tier }}
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        include:
          - tier: v128relaxed
            target_features: "+simd128,+relaxed-simd"
            relaxed_simd: "y"
            use_v128relaxed: 1
          - tier: v128
            target_features: "+simd128"
            relaxed_simd: "n"
            use_v128relaxed: 0
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Install WASI SDK
        run: |
          curl -sSL "https://github.com/WebAssembly/wasi-sdk/releases/download/wasi-sdk-${WASI_SDK_VERSION}/wasi-sdk-${WASI_SDK_VERSION}.0-x86_64-linux.tar.gz" \
            | tar xz -C "$HOME"
          echo "WASI_SDK_PATH=$HOME/wasi-sdk-${WASI_SDK_VERSION}.0-x86_64-linux" >> "$GITHUB_ENV"

      - name: Install Wasmtime
        run: |
          curl https://wasmtime.dev/install.sh -sSf | bash -s -- --version "$WASMTIME_VERSION"
          echo "$HOME/.wasmtime/bin" >> "$GITHUB_PATH"

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-wasip1

      # The C kernels need the WASI SDK clang and sysroot, and compile the SIMD tier that `RUSTFLAGS` declares.
      # Tests run single-threaded under Wasmtime, which refuses relaxed SIMD in the strict row.
      - name: Test Rust
        env:
          CC_wasm32_wasip1: ${{ env.WASI_SDK_PATH }}/bin/clang
          AR_wasm32_wasip1: ${{ env.WASI_SDK_PATH }}/bin/llvm-ar
          CFLAGS_wasm32_wasip1: --sysroot=${{ env.WASI_SDK_PATH }}/share/wasi-sysroot
          RUSTFLAGS: -C target-feature=${{ matrix.target_features }}
          CARGO_TARGET_WASM32_WASIP1_RUNNER: wasmtime -W relaxed-simd=${{ matrix.relaxed_simd }} --dir .
        run: |
          cargo build --target wasm32-wasip1
          cargo test --release --target wasm32-wasip1 -- --test-threads=1

      # The C++ suite every native platform runs; the strict row's module runs with relaxed SIMD refused.
      # The `utf8` filter stays until `test_hash_unit` stops asserting on wasm.
      - name: Build C++ tests for wasm32-wasip1
        run: |
          cmake -B build_wasi \
            -DCMAKE_TOOLCHAIN_FILE=cmake/toolchain-wasm32.cmake \
            -DWASI_SDK_PREFIX=${WASI_SDK_PATH} \
            -DSZ_USE_V128RELAXED=${{ matrix.use_v128relaxed }} \
            -DCMAKE_BUILD_TYPE=Release \
            -DSTRINGZILLA_BUILD_TEST=1 \
            -DSTRINGZILLA_BUILD_BENCHMARK=0 \
            -DSTRINGZILLA_BUILD_SHARED=0 \
            -DSTRINGZILLA_BUILD_CUDA=0
          cmake --build build_wasi --target stringzilla_test_cpp20
      - name: Test C++ UTF-8 suites under Wasmtime
        env:
          SZ_TESTS_FILTER: utf8
          SZ_TESTS_MULTIPLIER: "0.05"
        run: |
          wasmtime -W relaxed-simd=${{ matrix.relaxed_simd }} -W exceptions=y \
            --dir . --env SZ_TESTS_FILTER --env SZ_TESTS_MULTIPLIER \
            build_wasi/stringzilla_test_cpp20

  test_macos:
    name: MacOS
    runs-on: macos-15

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Log hardware capabilities
        run: |
          sysctl -a | grep machdep.cpu || true
          echo ""
          echo "System Info:"
          system_profiler SPHardwareDataType || true

        # C/C++
      - name: Install dependencies
        run: |
          brew update
          brew reinstall cmake
      - name: Build C/C++
        run: |
          cmake -B build_artifacts \
            -DCMAKE_BUILD_TYPE=RelWithDebInfo \
            -DCMAKE_EXPORT_COMPILE_COMMANDS=1 \
            -DSTRINGZILLA_BUILD_BENCHMARK=1 \
            -DSTRINGZILLA_BUILD_TEST=1
          cmake --build build_artifacts --config RelWithDebInfo
      - name: Test C++
        run: build_artifacts/stringzilla_test_cpp20
      - name: Test on Real World Data
        run: |
          build_artifacts/stringzilla_bench_find_cpp20 ${DATASET_PATH}      # for substring search
          build_artifacts/stringzilla_bench_token_cpp20 ${DATASET_PATH}     # for hashing, equality comparisons, etc.
          build_artifacts/stringzilla_bench_sequence_cpp20 ${DATASET_PATH}  # for sorting arrays of strings
          build_artifacts/stringzilla_bench_container_cpp20 ${DATASET_PATH} # for STL containers with string keys
        env:
          DATASET_PATH: ./README.md
        # Don't overload GitHub with our benchmarks.
        # The results in such an unstable environment will be meaningless anyway.
        if: 0

        # Python
      - name: Set up Python ${{ env.PYTHON_VERSION }}
        uses: actions/setup-python@v7
        with:
          python-version: ${{ env.PYTHON_VERSION }}
      - name: Build Python
        run: |
          python -m pip install --upgrade pip
          pip install pytest pytest-repeat numpy pyarrow
          python -m pip install .
        env:
          MACOSX_DEPLOYMENT_TARGET: "11.0"
      - name: Test Python
        run: python -X faulthandler -m pytest test/ -s -vv --maxfail=1 --full-trace

        # Rust
      - name: Set up Rust
        uses: dtolnay/rust-toolchain@stable
      - name: Test Rust with dynamic dispatch
        run: cargo test --release
      - name: Test Rust with compile-time dispatch
        run: cargo test --release --no-default-features --features std
      - name: Test Rust no_std
        run: cargo test --release --no-default-features

  test_swift_macos:
    name: Swift on macOS ${{ matrix.arch }}
    runs-on: xcode-27
    strategy:
      fail-fast: false
      matrix:
        arch: [arm64, x86_64]
    steps:
      - name: Checkout
        uses: actions/checkout@v7
      # The `x86_64` destination runs the Intel build under Rosetta, as no Intel image ships Xcode 27
      - name: Test Swift
        run: xcodebuild test -scheme StringZilla -destination 'platform=macOS,arch=${{ matrix.arch }}'

  test_swift_simulators:
    name: Swift on ${{ matrix.platform }} Simulator
    runs-on: xcode-27
    strategy:
      fail-fast: false
      matrix:
        platform: [iOS, tvOS, watchOS, visionOS]
    steps:
      - name: Checkout
        uses: actions/checkout@v7
      - name: Build for Simulator
        run: xcodebuild build -scheme StringZilla -destination 'generic/platform=${{ matrix.platform }} Simulator' CODE_SIGNING_ALLOWED=NO
      - name: Test on iPhone Simulator
        if: matrix.platform == 'iOS'
        run: xcodebuild test -scheme StringZilla -destination 'platform=iOS Simulator,OS=latest,name=iPhone 17' CODE_SIGNING_ALLOWED=NO

  test_swift_windows:
    name: Swift on Windows ${{ matrix.arch }}
    runs-on: ${{ matrix.arch == 'arm64' && 'windows-11-arm' || 'windows-2025' }}
    strategy:
      fail-fast: false
      matrix:
        arch: [amd64, arm64]
    steps:
      - name: Checkout
        uses: actions/checkout@v7
      - name: Set Up Swift
        uses: compnerd/gha-setup-swift@v0.5.0
        with:
          swift-version: swift-6.4.0-release
          swift-build: 6.4.0-RELEASE
          build_arch: ${{ matrix.arch }}
      - name: Test Swift
        run: swift test

  test_swift_android:
    name: Swift on Android
    uses: swiftlang/github-workflows/.github/workflows/swift_package_test.yml@fa1e46cf0f07ffde2de131e9ed5bd66a488c289c # main
    with:
      enable_linux_checks: false
      enable_windows_checks: false
      enable_android_sdk_build: true
      enable_android_sdk_checks: true
      android_sdk_versions: '["6.4"]'

  test_swift_wasm:
    name: Swift on WebAssembly WASI
    runs-on: ubuntu-24.04
    container: swift:6.4
    steps:
      - name: Checkout
        uses: actions/checkout@v7
      - name: Install Swift SDK for WebAssembly and Wasmtime
        run: |
          swift sdk install https://download.swift.org/swift-6.4.0-release/wasm-sdk/swift-6.4.0-RELEASE/swift-6.4.0-RELEASE_wasm.artifactbundle.tar.gz --checksum f07b7be3c586d92d7a07051fc6d303b87ebea67eadc40640ba59d5a8b79aa86d
          apt-get update && apt-get install -y curl xz-utils
          curl -fsSL https://wasmtime.dev/install.sh | bash
      - name: Build Library and Tests
        run: swift build --build-tests --swift-sdk swift-6.4.0-RELEASE_wasm
      - name: Test under Wasmtime
        run: ~/.wasmtime/bin/wasmtime run --dir / .build/debug/StringZillaTests-test-runner.wasm --testing-library swift-testing

  test_windows:
    name: Windows - ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-2022
            arch: x64
          - os: windows-11-arm
            arch: arm64
    steps:
      - name: Checkout
        uses: actions/checkout@v7
      - name: Set up MSVC developer environment
        uses: ilammy/msvc-dev-cmd@v1
        with:
          arch: ${{ matrix.arch }}

      - name: Log hardware capabilities
        shell: powershell
        run: |
          Get-CimInstance -ClassName Win32_Processor | Select-Object Name, NumberOfCores, NumberOfLogicalProcessors, MaxClockSpeed | Format-List

      - name: Build C/C++
        shell: cmd
        run: |
          cmake -GNinja -B build_artifacts ^
            -DCMAKE_BUILD_TYPE=RelWithDebInfo ^
            -DCMAKE_EXPORT_COMPILE_COMMANDS=1 ^
            -DSTRINGZILLA_BUILD_BENCHMARK=1 ^
            -DSTRINGZILLA_BUILD_TEST=1

          cmake --build build_artifacts --config RelWithDebInfo > build_artifacts/logs.txt 2>&1 || (
            echo "Compilation failed. Here are the logs:"
            type build_artifacts\logs.txt
            echo "The original compilation commands:"
            type build_artifacts\compile_commands.json
            exit 1
          )
      - name: Test C++
        run: .\build_artifacts\stringzilla_test_cpp20.exe
      - name: Check stringzilla_bare is built correctly
        shell: cmd
        run: dumpbin /nologo /dependents .\build_artifacts\stringzilla_bare.dll | findstr /r "[a-zA-Z0-9]\.dll" | findstr /r /v "KERNEL32.dll stringzilla" && exit /b 1 || exit /b 0
      - name: Test on Real World Data
        run: |
          .\build_artifacts\stringzilla_bench_find_cpp20.exe ${DATASET_PATH}      # for substring search
          .\build_artifacts\stringzilla_bench_token_cpp20.exe ${DATASET_PATH}     # for hashing, equality comparisons, etc.
          .\build_artifacts\stringzilla_bench_sequence_cpp20.exe ${DATASET_PATH}  # for sorting arrays of strings
          .\build_artifacts\stringzilla_bench_container_cpp20.exe ${DATASET_PATH} # for STL containers with string keys
        env:
          DATASET_PATH: ./README.md
        # Don't overload GitHub with our benchmarks.
        # The results in such an unstable environment will be meaningless anyway.
        if: 0

        # Python
      - name: Set up Python ${{ env.PYTHON_VERSION }}
        uses: actions/setup-python@v7
        with:
          python-version: ${{ env.PYTHON_VERSION }}
      - name: Build Python
        run: |
          python -m pip install --upgrade pip
          pip install pytest pytest-repeat numpy
          python -m pip install .
      - name: Test Python
        run: python -X faulthandler -m pytest test/ -s -vv --maxfail=1 --full-trace

        # Rust
      - name: Set up Rust
        uses: dtolnay/rust-toolchain@stable
      - name: Test Rust with dynamic dispatch
        run: cargo test --release
      - name: Build Rust with compile-time dispatch
        run: cargo build --release --no-default-features --features std
      - name: Build Rust no_std
        run: cargo build --release --no-default-features

  test_alpine:
    name: Alpine Linux
    runs-on: ubuntu-24.04
    container:
      image: alpine:latest
      options: --privileged # If needed for certain Docker operations
    steps:
      # bash and curl are required by dtolnay/rust-toolchain
      - name: Install Git for checkout
        run: |
          apk add --no-cache git openssh ca-certificates bash curl
          git --version
      - name: Log Alpine and Git versions
        run: |
          echo "Alpine: $(cat /etc/alpine-release 2>/dev/null || echo 'unknown')"
          git --version || echo "git not installed"
      - name: Checkout
        uses: actions/checkout@v7

      - name: Log hardware capabilities
        run: |
          lscpu || true
          echo ""
          echo "CPU Info:"
          grep -E "model name|flags" /proc/cpuinfo | head -5 || true

        # C/C++
      - name: Build C/C++
        run: |
          apk add --update make cmake g++ gcc
          cmake -B build_artifacts \
            -DCMAKE_BUILD_TYPE=RelWithDebInfo \
            -DCMAKE_EXPORT_COMPILE_COMMANDS=1 \
            -DSTRINGZILLA_BUILD_BENCHMARK=1 \
            -DSTRINGZILLA_BUILD_TEST=1
          cmake --build build_artifacts --config RelWithDebInfo
      - name: Test C++
        run: build_artifacts/stringzilla_test_cpp20
      - name: Check stringzilla_bare is built correctly
        run: test -z "$(ldd build_artifacts/libstringzilla_bare.so | grep '.so' | grep '=>')"

        # Python
      - name: Build Python
        run: |
          apk add python3 py3-pip python3-dev
          pip install --break-system-packages pytest pytest-repeat
          pip install --break-system-packages .
      - name: Test Python
        run: pytest test/ -s -x

        # Rust
      - name: Set up Rust
        uses: dtolnay/rust-toolchain@stable
      - name: Test Rust with compile-time dispatch
        run: cargo test --release --no-default-features --features std
      - name: Test Rust no_std
        run: cargo test --release --no-default-features
  # Packaging surface - what a downstream distributor sees, not what our own build tree sees. The consumers
  # check spellings by linking them: an undefined name fails at generate time.
  test_packaging:
    name: CMake Packaging
    runs-on: ubuntu-24.04
    env:
      HEADER_PREFIX: ${{ github.workspace }}/prefix_header
      FULL_PREFIX: ${{ github.workspace }}/prefix_full
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Install build tools
        run: |
          sudo apt update
          sudo apt install -y cmake build-essential

      - name: Write the consumer sources
        run: |
          mkdir -p consumer
          cat > consumer/main.c <<'EOF'
          #include <stdio.h>
          #include <stringzilla/stringzilla.h>
          int main(void) {
              char const *haystack = "hello world";
              char const *match = sz_find(haystack, 11, "world", 5);
              printf("%d\n", (int)(match - haystack));
              return match ? 0 : 1;
          }
          EOF

        # Every registry recipe depends on the header-only prefix configuring and installing cleanly.
      - name: Install the header-only package
        run: |
          cmake -B build_header -DSTRINGZILLA_INSTALL=ON -DSTRINGZILLA_BUILD_TEST=OFF \
            -DSTRINGZILLA_BUILD_BENCHMARK=OFF -DSTRINGZILLA_BUILD_SHARED=OFF \
            -DSTRINGZILLA_BUILD_CUDA=OFF -DCMAKE_INSTALL_PREFIX="$HEADER_PREFIX"
          cmake --install build_header

      - name: Consume the header-only package
        run: |
          cat > consumer/CMakeLists.txt <<'EOF'
          cmake_minimum_required(VERSION 3.21)
          project(consumer C)
          find_package(stringzilla REQUIRED)
          add_executable(consumer main.c)
          target_link_libraries(consumer PRIVATE stringzilla::header stringzilla::stringzilla_header stringzilla_header)
          EOF
          cmake -S consumer -B consumer/build -DCMAKE_PREFIX_PATH="$HEADER_PREFIX"
          cmake --build consumer/build
          ./consumer/build/consumer

      - name: Install the compiled libraries
        run: |
          cmake -B build_full -DCMAKE_BUILD_TYPE=Release -DSTRINGZILLA_INSTALL=ON \
            -DSTRINGZILLA_BUILD_TEST=OFF -DSTRINGZILLA_BUILD_BENCHMARK=OFF \
            -DSTRINGZILLA_BUILD_SHARED=ON -DSTRINGZILLA_BUILD_CUDA=OFF \
            -DCMAKE_INSTALL_PREFIX="$FULL_PREFIX"
          cmake --build build_full --parallel
          cmake --install build_full

        # The installed prefix must resolve the shared library's own exported targets.
      - name: Consume the compiled package
        run: |
          cat > consumer/CMakeLists.txt <<'EOF'
          cmake_minimum_required(VERSION 3.21)
          project(consumer C)
          find_package(stringzilla REQUIRED)
          add_executable(consumer main.c)
          target_link_libraries(consumer PRIVATE
              stringzilla::header stringzilla::shared stringzilla::stringzilla_shared stringzilla_shared)
          EOF
          rm -rf consumer/build
          cmake -S consumer -B consumer/build -DCMAKE_PREFIX_PATH="$FULL_PREFIX"
          cmake --build consumer/build
          LD_LIBRARY_PATH="$FULL_PREFIX/lib" ./consumer/build/consumer

        # The `.pc` exists for build systems CMake never reaches, so it is checked without CMake.
      - name: Consume via pkg-config
        run: |
          export PKG_CONFIG_PATH="$FULL_PREFIX/lib/pkgconfig"
          test "$(pkg-config --modversion stringzilla)" = "$(cat VERSION)"
          cc consumer/main.c $(pkg-config --cflags --libs stringzilla) -o consumer/pc_consumer
          LD_LIBRARY_PATH="$FULL_PREFIX/lib" ./consumer/pc_consumer

        # The in-tree aliases are a separate code path from the installed package's exported targets.
      - name: Consume via add_subdirectory
        run: |
          cat > consumer/CMakeLists.txt <<EOF
          cmake_minimum_required(VERSION 3.21)
          project(consumer C CXX)
          set(STRINGZILLA_BUILD_SHARED ON CACHE BOOL "" FORCE)
          add_subdirectory($GITHUB_WORKSPACE stringzilla_build)
          # `bare` is libc-free and overrides libc symbols, so it is checked rather than linked in.
          if (NOT TARGET stringzilla::bare)
              message(FATAL_ERROR "stringzilla::bare alias is missing")
          endif ()
          add_executable(consumer main.c)
          target_link_libraries(consumer PRIVATE stringzilla::header stringzilla::shared)
          EOF
          rm -rf consumer/build
          cmake -S consumer -B consumer/build
          cmake --build consumer/build --target consumer --parallel
          ./consumer/build/consumer

  # Native wheels - each runner's native arch (Linux pinned to x86_64; emulated arches in `build_wheels_emulated`).
  # windows-11-arm validates the Windows ARM64 wheel that release ships; ARM64 CPython is official from 3.11.
  build_wheels_native:
    name: Build Python ${{ matrix.python-version }} for ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    needs:
      [
        test_ubuntu_gcc,
        test_ubuntu_clang,
        test_macos,
        test_windows,
        test_cross_linux,
      ]
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, macos-15, windows-2022, windows-11-arm]
        python-version: ["310", "311", "312", "313", "314", "314t"]
        exclude:
          - os: windows-11-arm
            python-version: "310"
    steps:
      - name: Checkout
        uses: actions/checkout@v7
      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: 3.x
      - name: Install cibuildwheel
        run: python -m pip install cibuildwheel==3.4.1
      - name: Build wheels
        run: cibuildwheel --output-dir wheelhouse
        env:
          CIBW_BUILD: cp${{ matrix.python-version }}-*
          CIBW_ARCHS_LINUX: x86_64

  # Emulated Linux wheels - one arch per runner so no runner pulls every image; fuzz depth thinned under QEMU.
  build_wheels_emulated:
    name: Build Python wheels for ${{ matrix.arch }}
    runs-on: ubuntu-24.04
    needs:
      [
        test_ubuntu_gcc,
        test_ubuntu_clang,
        test_macos,
        test_windows,
        test_cross_linux,
      ]
    strategy:
      fail-fast: false
      matrix:
        arch: [aarch64, ppc64le, s390x, i686, armv7l, riscv64]
    steps:
      - name: Checkout
        uses: actions/checkout@v7
      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: 3.x
      - name: Setup QEMU
        uses: docker/setup-qemu-action@v4
      - name: Install cibuildwheel
        run: python -m pip install cibuildwheel==3.4.1
      - name: Build wheels
        run: cibuildwheel --output-dir wheelhouse
        env:
          CIBW_BUILD: "cp310-* cp311-* cp312-* cp313-* cp314-*"
          CIBW_ARCHS_LINUX: ${{ matrix.arch }}
          # SZ_IS_QEMU_ disables tricky SIMD; SZ_TESTS_MULTIPLIER matches `test_cross_qemu`.
          CIBW_ENVIRONMENT_LINUX: SZ_IS_QEMU_=1 SZ_TESTS_MULTIPLIER=0.05
