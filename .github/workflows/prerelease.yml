name: "Pre-Release"

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main*"]

# One group per source branch, so a `main*` branch with an open PR is not built twice - `push` no longer
# matches it, and `head_ref` folds any number of PRs from that branch into the same group. Superseded PR
# runs are cancelled; `main` runs are not, so a build feeding the release pipeline is never killed midway.
concurrency:
  group: ${{ github.workflow }}-${{ github.head_ref || github.ref_name }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  BUILD_TYPE: Release
  GH_TOKEN: ${{ secrets.SEMANTIC_RELEASE_TOKEN }}
  PYTHON_VERSION: 3.13
  PYTHONUTF8: 1
  WASI_SDK_VERSION: "34"
  # Pinned to the 48 LTS line so the wasm rows run a reproducible engine that speaks exnref exception handling.
  WASMTIME_VERSION: v48.0.3

# `actions: read` lets the Android job, which runs in another repository's workflow, download this run's artifacts.
permissions:
  actions: read
  contents: read

jobs:
  versioning:
    name: Update Version
    runs-on: ubuntu-26.04
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0
          fetch-tags: true
          persist-credentials: false
      - name: Run TinySemVer
        uses: ashvardanian/tinysemver@v3
        with:
          verbose: "true"
          version-file: "VERSION"
          update-version-in: |
            Cargo.toml:^version = "(\d+\.\d+\.\d+)"
            package.json:"version": "(\d+\.\d+\.\d+)"
            package.json:"@stringzilla/darwin-arm64": "(\d+\.\d+\.\d+)"
            package.json:"@stringzilla/darwin-x64": "(\d+\.\d+\.\d+)"
            package.json:"@stringzilla/linux-arm64": "(\d+\.\d+\.\d+)"
            package.json:"@stringzilla/linux-x64": "(\d+\.\d+\.\d+)"
            package.json:"@stringzilla/win32-arm64": "(\d+\.\d+\.\d+)"
            package.json:"@stringzilla/win32-x64": "(\d+\.\d+\.\d+)"
            javascript/@stringzilla-darwin-arm64/package.json:"version": "(\d+\.\d+\.\d+)"
            javascript/@stringzilla-darwin-x64/package.json:"version": "(\d+\.\d+\.\d+)"
            javascript/@stringzilla-linux-arm64/package.json:"version": "(\d+\.\d+\.\d+)"
            javascript/@stringzilla-linux-x64/package.json:"version": "(\d+\.\d+\.\d+)"
            javascript/@stringzilla-win32-arm64/package.json:"version": "(\d+\.\d+\.\d+)"
            javascript/@stringzilla-win32-x64/package.json:"version": "(\d+\.\d+\.\d+)"
            Package.swift:releases/download/v(\d+\.\d+\.\d+)
            CITATION.cff:^version: (\d+\.\d+\.\d+)
            StringZilla.csproj:<Version>(\d+\.\d+\.\d+)</Version>
            pom.xml:<artifactId>stringzilla</artifactId>\n  <version>(\d+\.\d+\.\d+)</version>
          update-major-version-in: |
            include/stringzilla/types.h:^#define STRINGZILLA_H_VERSION_MAJOR (\d+)
          update-minor-version-in: |
            include/stringzilla/types.h:^#define STRINGZILLA_H_VERSION_MINOR (\d+)
          update-patch-version-in: |
            include/stringzilla/types.h:^#define STRINGZILLA_H_VERSION_PATCH (\d+)
          dry-run: "true"

  test_ubuntu_gcc:
    name: Ubuntu GCC 12 - ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-26.04, ubuntu-26.04-arm]
    env:
      CC: gcc-12
      CXX: g++-12

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Log hardware capabilities
        run: |
          lscpu
          echo ""
          echo "CPU Info:"
          grep -E "model name|flags" /proc/cpuinfo | head -5 || true

        # C/C++
        # If the compilation fails, we want to log the compilation commands in addition to
        # the standard output.
      - name: Install dependencies
        run: |
          sudo apt update
          sudo apt install -y build-essential gcc-12 g++-12

      - name: Build C/C++
        run: |
          cmake --preset release

          cmake --build --preset release > build_release/logs.txt 2>&1 || {
            echo "Compilation failed. Here are the logs:"
            cat build_release/logs.txt
            echo "The original compilation commands:"
            cat build_release/compile_commands.json
            echo "GCC Version:"
            gcc-12 --version
            echo "G++ Version:"
            g++-12 --version
            exit 1
          }
      - name: Test C++
        run: ctest --preset release
      - name: Build static library for Go binding
        run: |
          cmake --preset release_shared
          cmake --build --preset release_shared --target stringzilla_static
          cp build_release_shared/libstringzilla_static.a golang/
      - name: Set up Go
        uses: actions/setup-go@v7
        with:
          go-version: ">=1.24"
          cache: false
      - name: Test Go binding
        working-directory: golang
        run: go test -v -tags no_sha256 # Skip SHA tests for GCC
      - name: Test on Real World Data
        run: build_release/stringzilla_bench
        env:
          STRINGWARS_DATASET: ./README.md
        # Don't overload GitHub with our benchmarks.
        # The results in such an unstable environment will be meaningless anyway.
        if: 0

        # Python
      - name: Set up Python ${{ env.PYTHON_VERSION }}
        uses: actions/setup-python@v7
        with:
          python-version: ${{ env.PYTHON_VERSION }}
      - name: Build Python
        run: |
          python -m pip install --upgrade pip
          python -m pip install --group test --group test-oracles .
      - name: Log Python capabilities
        run: |
          python - << 'PY'
          import platform
          import stringzilla as sz
          print("platform:", platform.platform())
          print("machine:", platform.machine(), "processor:", platform.processor())
          print("capabilities:", repr(sz.cpu_capabilities_enabled()))
          PY
      - name: Test Python
        run: python -X faulthandler -m pytest -x

        # JavaScript
      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 22
        # Without `--omit=optional`, the published `@stringzilla/*` addon satisfies the install and shadows this tree's.
      - name: Build and test JavaScript
        run: npm install --ignore-scripts --omit=optional && npm run prebuild && npm test

      # Rust, on nightly until 1.100 reaches stable, as `rust-version` rejects any older compiler
      - name: Set up Rust
        uses: dtolnay/rust-toolchain@nightly
      - name: Test Rust
        run: cargo test --release
      - name: Test Rust no_std
        run: cargo test --release --no-default-features
        # Otherwise `cargo publish` is the first thing that ever reads the `include` list.
      - name: Package the crate
        run: cargo package --locked

  test_ubuntu_clang:
    name: Ubuntu Clang 16 - ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        # Clang 16 is the floor, and neither Ubuntu 26.04 nor apt.llvm.org packages it for 26.04
        os: [ubuntu-22.04, ubuntu-22.04-arm]
    env:
      CC: clang-16
      CXX: clang++-16

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Log hardware capabilities
        run: |
          lscpu
          echo ""
          echo "CPU Info:"
          grep -E "model name|flags" /proc/cpuinfo | head -5 || true

        # C/C++
        # Clang 16 isn't available from default repos on Ubuntu 22.04, so we have to install it manually
      - name: Install dependencies
        run: |
          sudo apt update
          sudo apt install -y build-essential ninja-build libjemalloc-dev
          wget https://apt.llvm.org/llvm.sh
          chmod +x llvm.sh
          sudo ./llvm.sh 16

      - name: Build C/C++
        run: |
          cmake --preset release

          cmake --build --preset release > build_release/logs.txt 2>&1 || {
            echo "Compilation failed. Here are the logs:"
            cat build_release/logs.txt
            echo "The original compilation commands:"
            cat build_release/compile_commands.json
            echo "Clang Version:"
            clang-16 --version
            echo "Clang++ Version:"
            clang++-16 --version
            exit 1
          }
      - name: Test C++
        run: ctest --preset release
      - name: Build static library for Go binding
        run: |
          cmake --preset release_shared
          cmake --build --preset release_shared --target stringzilla_static
          cp build_release_shared/libstringzilla_static.a golang/
      - name: Set up Go
        uses: actions/setup-go@v7
        with:
          go-version: ">=1.24"
          cache: false
      - name: Test Go binding
        working-directory: golang
        run: go test -v
      - name: Test on Real World Data
        run: build_release/stringzilla_bench
        env:
          STRINGWARS_DATASET: ./README.md
        # Don't overload GitHub with our benchmarks.
        # The results in such an unstable environment will be meaningless anyway.
        if: 0

        # Python
      - name: Set up Python ${{ env.PYTHON_VERSION }}
        uses: actions/setup-python@v7
        with:
          python-version: ${{ env.PYTHON_VERSION }}
      - name: Build Python
        run: |
          python -m pip install --upgrade pip
          python -m pip install --group test --group test-oracles .
      - name: Log Python capabilities
        run: |
          python - << 'PY'
          import platform
          import stringzilla as sz
          print("platform:", platform.platform())
          print("machine:", platform.machine(), "processor:", platform.processor())
          print("capabilities:", repr(sz.cpu_capabilities_enabled()))
          PY
      - name: Test Python
        run: python -X faulthandler -m pytest -x

        # Rust, on nightly until 1.100 reaches stable, as `rust-version` rejects any older compiler
      - name: Set up Rust
        uses: dtolnay/rust-toolchain@nightly
      - name: Test Rust
        run: cargo test --release
      - name: Test Rust no_std
        run: cargo test --release --no-default-features

  test_ubuntu_debug:
    name: Test Debug build with sanitizers on Ubuntu
    runs-on: ubuntu-26.04
    env:
      CC: gcc-12
      CXX: g++-12

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Install dependencies
        run: |
          sudo apt update
          sudo apt install -y build-essential gcc-12 g++-12

        # Debug sanitizes the executables and builds the shared library alongside, all with `STRINGZILLA_DEBUG` asserts live.
      - name: Build C/C++
        run: |
          cmake --preset debug
          cmake --build --preset debug
      - name: Test C++
        env:
          STRINGZILLA_SCALE: "0.1"
        run: ctest --preset debug
      - name: Set up Go
        uses: actions/setup-go@v7
        with:
          go-version: ">=1.24"
          cache: false
        # cGo links no sanitizer runtime, so the Go binding takes a Debug archive built without them.
      - name: Build Debug static library for Go binding
        run: |
          cmake --preset debug -B build_golang -D STRINGZILLA_USE_SANITIZERS=OFF
          cmake --build build_golang --target stringzilla_static
      - name: Test Go binding against the Debug static library
        working-directory: golang
        env:
          CGO_LDFLAGS: -L${{ github.workspace }}/build_golang
        run: go test -v -tags no_sha256 # Skip SHA tests for GCC
      - name: Set up Python ${{ env.PYTHON_VERSION }}
        uses: actions/setup-python@v7
        with:
          python-version: ${{ env.PYTHON_VERSION }}
      - name: Build Python with asserts
        run: |
          python -m pip install --upgrade pip
          python -m pip install --group test --group test-oracles . -C cmake.build-type=Debug -C cmake.define.STRINGZILLA_USE_SANITIZERS=OFF
      - name: Test Python
        run: python -X faulthandler -m pytest -x

  test_ubuntu_cuda:
    name: Ubuntu CUDA
    runs-on: ubuntu-26.04
    # NVIDIA publishes no Ubuntu 26.04 CUDA image yet, so the toolkit comes in a 24.04 container.
    container: nvidia/cuda:13.0.1-devel-ubuntu24.04

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Log hardware capabilities
        run: |
          lscpu
          echo ""
          echo "CPU Info:"
          grep -E "model name|flags" /proc/cpuinfo | head -5 || true
          echo ""
          echo "GPU Info:"
          nvcc --version
          nvidia-smi 2>/dev/null || echo "nvidia-smi not available, as expected on a GPU-less runner"

        # C/C++
      - name: Install dependencies
        run: |
          apt-get update
          apt-get install -y cmake ninja-build build-essential git

      - name: Build C/C++ with CUDA
        run: |
          # Release rather than RelWithDebInfo: optimized debugging is unsupported in CUDA and fails in PTXAS
          cmake --preset cuda

          cmake --build --preset cuda > build_cuda/logs.txt 2>&1 || {
            echo "Compilation failed. Here are the logs:"
            cat build_cuda/logs.txt
            echo "The original compilation commands:"
            cat build_cuda/compile_commands.json
            echo "CUDA Version:"
            nvcc --version
            echo "G++ Version:"
            g++ --version
            exit 1
          }
      - name: Test C++
        run: ctest --preset cuda -R '^stringzilla_test$'

  # Compile-only in practice: no hosted runner has an AMD GPU, and the test exits zero without one.
  test_ubuntu_rocm:
    name: Ubuntu ROCm
    runs-on: ubuntu-26.04
    container: rocm/dev-ubuntu-26.04:latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7
      - name: Install dependencies
        run: |
          apt-get update
          apt-get install -y cmake ninja-build git
          # The image leaves the HIP runtime off the loader path, so the tests could link but not start
          dirname "$(find /opt/rocm/ -name libamdhip64.so.7 | head -1)" > /etc/ld.so.conf.d/rocm.conf && ldconfig
      - name: Build C/C++ with ROCm
        run: |
          cmake --preset rocm
          cmake --build --preset rocm
      - name: Test C++
        run: ctest --preset rocm

  # Apple Silicon runners expose a paravirtualized GPU, so the Metal kernels compile and run here.
  test_macos_metal:
    name: MacOS Metal
    runs-on: macos-15
    steps:
      - name: Checkout
        uses: actions/checkout@v7
      - name: Build C/C++ with Metal
        run: |
          cmake --preset metal
          cmake --build --preset metal
      - name: Test C++
        run: ctest --preset metal

  # No hosted runner has an Nvidia or AMD GPU, so the `cuda` and `rocm` features, which build through CMake, are link checks.
  build_rust_cuda:
    name: Build Rust with CUDA
    runs-on: ubuntu-26.04
    # NVIDIA publishes no Ubuntu 26.04 CUDA image yet, so the toolkit comes in a 24.04 container.
    container: nvidia/cuda:13.0.1-devel-ubuntu24.04
    steps:
      - name: Install dependencies
        run: apt-get update && apt-get install -y cmake build-essential git curl
      - name: Checkout
        uses: actions/checkout@v7
      - name: Set up Rust
        uses: dtolnay/rust-toolchain@nightly
      - name: Link Rust tests with CUDA
        run: cargo test --features cuda --no-run

  build_rust_rocm:
    name: Build Rust with ROCm
    runs-on: ubuntu-26.04
    container: rocm/dev-ubuntu-26.04:latest
    steps:
      - name: Install dependencies
        run: apt-get update && apt-get install -y cmake make git curl
      - name: Checkout
        uses: actions/checkout@v7
      - name: Set up Rust
        uses: dtolnay/rust-toolchain@nightly
      - name: Link Rust tests with ROCm
        run: cargo test --features rocm --no-run

  # Every Swift job links the zipped XCFramework or artifact bundle a release would ship, built by CMake from this commit.
  build_swift_artifacts:
    name: Build Swift Artifacts
    uses: ./.github/workflows/_swift.yml

  test_ubuntu_swift:
    name: Swift on Linux ${{ matrix.arch }}
    needs: build_swift_artifacts
    runs-on: ${{ matrix.arch == 'arm64' && 'ubuntu-26.04-arm' || 'ubuntu-26.04' }}
    container: swift:6.4
    strategy:
      fail-fast: false
      matrix:
        arch: [x86_64, arm64]
    env:
      STRINGZILLA_SWIFT_ARTIFACT: StringZillaC.artifactbundle.zip
    steps:
      - name: Checkout
        uses: actions/checkout@v7
      - name: Download Artifact Bundle
        uses: actions/download-artifact@v8
        with:
          name: swift-artifactbundle

      - name: Log hardware capabilities
        run: |
          lscpu || true
          echo ""
          echo "CPU Info:"
          grep -E "model name|flags" /proc/cpuinfo | head -5 || true

      - name: Test Swift
        run: swift test

  test_ubuntu_dotnet:
    name: C# on Linux
    runs-on: ubuntu-26.04
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Build shared library
        run: |
          cmake --preset release_shared
          cmake --build --preset release_shared

        # The runtime resolver probes runtimes/{rid}/native first; the shared target emits
        # libstringzilla_shared.so, so copy it under the name the binding looks up.
      - name: Stage native library
        run: |
          mkdir -p csharp/runtimes/linux-x64/native
          cp -L build_release_shared/libstringzilla_shared.so csharp/runtimes/linux-x64/native/libstringzilla.so

      - name: Set up .NET
        uses: actions/setup-dotnet@v6
        with:
          dotnet-version: 8.0.x

      - name: Check formatting
        run: |
          dotnet format StringZilla.csproj --verify-no-changes
          dotnet format csharp/StringZillaTests.csproj --verify-no-changes

      - name: Test C#
        run: dotnet test csharp/StringZillaTests.csproj -c Release --nologo

  test_ubuntu_java:
    name: Java on Linux
    runs-on: ubuntu-26.04
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Build shared library
        run: |
          cmake --preset release_shared
          cmake --build --preset release_shared

        # NativeLoader extracts /native/{os}-{arch}/libstringzilla.so from the classpath at runtime;
        # Maven copies src/main/resources into target/classes before the tests run.
      - name: Stage native library
        run: |
          mkdir -p java/src/main/resources/native/linux-x86_64
          cp -L build_release_shared/libstringzilla_shared.so java/src/main/resources/native/linux-x86_64/libstringzilla.so

        # JDK 23: finalized Foreign Function & Memory API (since 22) and Palantir Java Format (needs <= 23).
      - name: Set up JDK
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "23"
          cache: maven

      - name: Check formatting
        run: mvn -B spotless:check

      - name: Test Java
        run: mvn -B test

  # Cross-compile the static test executables once per target architecture and publish them as artifacts. The
  # actual execution under QEMU happens in `test_cross_qemu`, which fans the vector-length-agnostic RISC-V
  # binary across several VLENs WITHOUT recompiling it.
  test_cross_linux:
    name: Cross Compile ${{ matrix.arch }} to ${{ matrix.target_arch }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-26.04
            arch: x86-64
            target_arch: aarch64
            target: aarch64-linux-gnu
            target_processor: arm64
            cross_package: crossbuild-essential-arm64
            file_id: aarch64 # substring `file` prints for this ELF
          - os: ubuntu-26.04-arm
            arch: aarch64
            target_arch: x86-64
            target: x86_64-linux-gnu
            target_processor: amd64
            cross_package: crossbuild-essential-amd64
            file_id: x86-64
          - os: ubuntu-26.04
            arch: x86-64
            target_arch: riscv64
            target: riscv64-linux-gnu
            target_processor: riscv64
            cross_package: crossbuild-essential-riscv64
            file_id: RISC-V # `file` prints "UCB RISC-V", not "riscv64"
          - os: ubuntu-26.04
            arch: x86-64
            target_arch: loongarch64
            target: loongarch64-linux-gnu
            target_processor: loong64
            cross_package: g++-15-loongarch64-linux-gnu
            cc: loongarch64-linux-gnu-gcc-15
            cxx: loongarch64-linux-gnu-g++-15
            file_id: LoongArch
          - os: ubuntu-26.04
            arch: x86-64
            target_arch: ppc64le
            target: powerpc64le-linux-gnu
            target_processor: ppc64el
            cross_package: g++-15-powerpc64le-linux-gnu
            cc: powerpc64le-linux-gnu-gcc-15
            cxx: powerpc64le-linux-gnu-g++-15
            file_id: PowerPC

    # LASX and POWER9 scope per function only from GCC 15 on, so those two legs cross-compile with GCC.
    env:
      CC: ${{ matrix.cc || 'clang-21' }}
      CXX: ${{ matrix.cxx || 'clang++-21' }}
      AR: llvm-ar-21
      NM: llvm-nm-21
      RANLIB: llvm-ranlib-21

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Log hardware capabilities
        run: |
          echo "Cross-Compilation: ${{ matrix.arch }} → ${{ matrix.target_arch }}"
          lscpu
          echo ""
          echo "CPU Info:"
          grep -E "model name|flags" /proc/cpuinfo | head -5 || true

      - name: Install cross-compilation toolchain
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential clang-21 lld-21 llvm-21 ${{ matrix.cross_package }}

      - name: Build C/C++ for ${{ matrix.target_arch }}
        run: |
          # Static-link the test/benchmark executables so QEMU user-mode can run them without juggling the
          # cross dynamic loader + sysroot library paths. `clang` drives the GNU linker directly and does not
          # add `-lstdc++` on its own, so we point it at the cross libstdc++ and pull it in explicitly.
          gcc_libdir=$(dirname "$(find /usr/lib/gcc-cross/${{ matrix.target }} -name 'libstdc++.a' 2>/dev/null | head -1)")
          cmake --preset release \
            -D CMAKE_C_COMPILER_TARGET=${{ matrix.target }} \
            -D CMAKE_CXX_COMPILER_TARGET=${{ matrix.target }} \
            -D CMAKE_SYSTEM_NAME=Linux \
            -D CMAKE_SYSTEM_PROCESSOR=${{ matrix.target_processor }} \
            -D CMAKE_EXE_LINKER_FLAGS="-static -L${gcc_libdir} -lstdc++ -lm"

          cmake --build --preset release

      - name: Verify ${{ matrix.target_arch }} binaries
        run: |
          test -e build_release/libstringzilla_shared.so
          test -e build_release/stringzilla_test
          file build_release/stringzilla_test | grep -q "${{ matrix.file_id }}"
          echo "✓ ${{ matrix.target_arch }} binaries built successfully"

      - name: Upload ${{ matrix.target_arch }} test binaries
        uses: actions/upload-artifact@v7
        with:
          name: cross-tests-${{ matrix.target_arch }}
          path: build_release/stringzilla_cpu*_test
          if-no-files-found: error
          retention-days: 1

  # Run the cross-compiled (static) test binaries under QEMU user-mode. Build-and-verify alone never exercised
  # the SIMD kernels. Each row is its own pass/fail status; RVV/SVE are vector-length-agnostic, so the RISC-V
  # binary built once above is swept across VLEN 128/256/512 here (`-cpu rv64,v=true,vlen=N`) with no rebuild —
  # a single width under-tests VLA code.
  test_cross_qemu:
    name: QEMU Tests ${{ matrix.target_arch }}${{ matrix.variant }}
    needs: test_cross_linux
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        include:
          # ARM is vector-length-agnostic under SVE just like RISC-V, so the one binary is run NEON-only
          # (`sve=off`, else dynamic dispatch always prefers SVE2 and NEON is never exercised) plus SVE at
          # 128/256/512-bit (`sve-max-vq` = VL/128).
          - target_arch: aarch64
            qemu: qemu-aarch64-static
            qemu_cpu: "max,sve=off"
            variant: " @ neon"
          - target_arch: aarch64
            qemu: qemu-aarch64-static
            qemu_cpu: "max,sve-max-vq=1"
            variant: " @ sve=128"
          - target_arch: aarch64
            qemu: qemu-aarch64-static
            qemu_cpu: "max,sve-max-vq=2"
            variant: " @ sve=256"
          - target_arch: aarch64
            qemu: qemu-aarch64-static
            qemu_cpu: "max,sve-max-vq=4"
            variant: " @ sve=512"
          - target_arch: x86-64
            qemu: qemu-x86_64-static
            qemu_cpu: max
            variant: ""
          - target_arch: riscv64
            qemu: qemu-riscv64-static
            qemu_cpu: "rv64,v=true,vlen=128"
            variant: " @ vlen=128"
          - target_arch: riscv64
            qemu: qemu-riscv64-static
            qemu_cpu: "rv64,v=true,vlen=256"
            variant: " @ vlen=256"
          - target_arch: riscv64
            qemu: qemu-riscv64-static
            qemu_cpu: "rv64,v=true,vlen=512"
            variant: " @ vlen=512"
          - target_arch: loongarch64
            qemu: qemu-loongarch64-static
            qemu_cpu: la464
            variant: ""
          - target_arch: ppc64le
            qemu: qemu-ppc64le-static
            qemu_cpu: power9
            variant: ""

    steps:
      - name: Install QEMU user-mode
        run: |
          sudo apt-get update
          sudo apt-get install -y qemu-user-static

      - name: Download ${{ matrix.target_arch }} test binaries
        uses: actions/download-artifact@v8
        with:
          name: cross-tests-${{ matrix.target_arch }}
          path: tests

      - name: Run tests under QEMU for ${{ matrix.target_arch }}${{ matrix.variant }}
        timeout-minutes: 150
        env:
          # User-mode emulation runs the fuzz loops 20-40x slower than native hardware; the full
          # iteration budget needs over six hours per variant and the jobs die at the runner
          # timeout without ever reaching the later test families. A scaled-down budget still
          # sweeps every backend and vector length within the job limits.
          STRINGZILLA_SCALE: "0.05"
        run: |
          set -euo pipefail
          chmod +x tests/*
          for test_binary in $(find tests -type f -name 'stringzilla_cpu*_test' | sort); do
            echo "▶ ${{ matrix.qemu }} -cpu ${{ matrix.qemu_cpu }} ${test_binary}"
            ${{ matrix.qemu }} -cpu "${{ matrix.qemu_cpu }}" "${test_binary}"
          done

  test_wasm:
    name: WebAssembly wasm32-wasip1 ${{ matrix.tier }}
    runs-on: ubuntu-26.04
    strategy:
      fail-fast: false
      matrix:
        include:
          - tier: v128relaxed
            target_features: "+simd128,+relaxed-simd"
            relaxed_simd: "y"
          - tier: v128
            target_features: "+simd128"
            relaxed_simd: "n"
          - tier: serial
            target_features: "-simd128"
            relaxed_simd: "n"
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Install WASI SDK
        run: |
          curl -sSL "https://github.com/WebAssembly/wasi-sdk/releases/download/wasi-sdk-${WASI_SDK_VERSION}/wasi-sdk-${WASI_SDK_VERSION}.0-x86_64-linux.tar.gz" \
            | tar xz -C "$HOME"
          echo "WASI_SDK_PATH=$HOME/wasi-sdk-${WASI_SDK_VERSION}.0-x86_64-linux" >> "$GITHUB_ENV"

      - name: Install Wasmtime
        run: |
          curl https://wasmtime.dev/install.sh -sSf | bash -s -- --version "$WASMTIME_VERSION"
          echo "$HOME/.wasmtime/bin" >> "$GITHUB_PATH"

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@nightly
        with:
          targets: wasm32-wasip1

      # `build.rs` builds the C library through the WASI toolchain file, which finds the SDK from `WASI_SDK_PATH`,
      # with the SIMD kit `RUSTFLAGS` declares. Tests run single-threaded under Wasmtime, which refuses relaxed SIMD
      # in the strict rows.
      - name: Test Rust
        env:
          RUSTFLAGS: -C target-feature=${{ matrix.target_features }}
          CARGO_TARGET_WASM32_WASIP1_RUNNER: wasmtime -W relaxed-simd=${{ matrix.relaxed_simd }} -S inherit-env=y --dir .
        run: |
          cargo build --target wasm32-wasip1
          cargo test --release --target wasm32-wasip1 -- --test-threads=1

      # The C++ suite every native platform runs; the strict rows' modules run with relaxed SIMD refused.
      # The `utf8` filter stays until `test_hash_unit` stops asserting on wasm.
      - name: Build C++ tests for wasm32-wasip1
        run: |
          cmake --preset wasm32_wasi -D WASI_SDK_PREFIX="${WASI_SDK_PATH}" -D STRINGZILLA_TARGET_ARCH=${{ matrix.tier }}
          cmake --build --preset wasm32_wasi
      - name: Test C++ UTF-8 suites under Wasmtime
        env:
          STRINGZILLA_FILTER: utf8
          STRINGZILLA_SCALE: "0.05"
        run: |
          wasmtime -W relaxed-simd=${{ matrix.relaxed_simd }} -W exceptions=y \
            -S inherit-env=y --dir . \
            build_wasm32_wasi/stringzilla_test

  test_macos:
    name: MacOS
    runs-on: macos-15

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Log hardware capabilities
        run: |
          sysctl -a | grep machdep.cpu || true
          echo ""
          echo "System Info:"
          system_profiler SPHardwareDataType || true

        # C/C++
      - name: Install dependencies
        run: |
          brew update
          brew reinstall cmake
      - name: Build C/C++
        run: |
          cmake --preset release
          cmake --build --preset release
      - name: Test C++
        run: ctest --preset release
      - name: Test on Real World Data
        run: build_release/stringzilla_bench
        env:
          STRINGWARS_DATASET: ./README.md
        # Don't overload GitHub with our benchmarks.
        # The results in such an unstable environment will be meaningless anyway.
        if: 0

        # Python
      - name: Set up Python ${{ env.PYTHON_VERSION }}
        uses: actions/setup-python@v7
        with:
          python-version: ${{ env.PYTHON_VERSION }}
      - name: Build Python
        run: |
          python -m pip install --upgrade pip
          python -m pip install --group test --group test-oracles .
        env:
          MACOSX_DEPLOYMENT_TARGET: "11.0"
      - name: Test Python
        run: python -X faulthandler -m pytest -x

        # Rust, on nightly until 1.100 reaches stable, as `rust-version` rejects any older compiler
      - name: Set up Rust
        uses: dtolnay/rust-toolchain@nightly
      - name: Test Rust
        run: cargo test --release
      - name: Test Rust no_std
        run: cargo test --release --no-default-features
      - name: Test Rust with Metal
        run: cargo test --release --features metal

  test_swift_macos:
    name: Swift on macOS ${{ matrix.arch }}
    needs: build_swift_artifacts
    runs-on: xcode-27
    strategy:
      fail-fast: false
      matrix:
        arch: [arm64, x86_64]
    env:
      STRINGZILLA_SWIFT_ARTIFACT: StringZillaC.xcframework.zip
    steps:
      - name: Checkout
        uses: actions/checkout@v7
      - name: Download XCFramework
        uses: actions/download-artifact@v8
        with:
          name: swift-xcframework
      # The `x86_64` destination runs the Intel build under Rosetta, as no Intel image ships Xcode 27
      - name: Test Swift
        run: xcodebuild test -scheme StringZilla -destination 'platform=macOS,arch=${{ matrix.arch }}'

  test_swift_simulators:
    name: Swift on ${{ matrix.platform }} Simulator
    needs: build_swift_artifacts
    runs-on: xcode-27
    strategy:
      fail-fast: false
      matrix:
        platform: [iOS, tvOS, watchOS, visionOS]
    env:
      STRINGZILLA_SWIFT_ARTIFACT: StringZillaC.xcframework.zip
    steps:
      - name: Checkout
        uses: actions/checkout@v7
      - name: Download XCFramework
        uses: actions/download-artifact@v8
        with:
          name: swift-xcframework
      - name: Build for Simulator
        run: xcodebuild build -scheme StringZilla -destination 'generic/platform=${{ matrix.platform }} Simulator' CODE_SIGNING_ALLOWED=NO
      - name: Test on iPhone Simulator
        if: matrix.platform == 'iOS'
        run: xcodebuild test -scheme StringZilla -destination 'platform=iOS Simulator,OS=latest,name=iPhone 17' CODE_SIGNING_ALLOWED=NO

  test_swift_windows:
    name: Swift on Windows ${{ matrix.arch }}
    needs: build_swift_artifacts
    runs-on: ${{ matrix.arch == 'arm64' && 'windows-11-arm' || 'windows-2025' }}
    strategy:
      fail-fast: false
      matrix:
        arch: [amd64, arm64]
    env:
      STRINGZILLA_SWIFT_ARTIFACT: StringZillaC.artifactbundle.zip
    steps:
      - name: Checkout
        uses: actions/checkout@v7
      - name: Download Artifact Bundle
        uses: actions/download-artifact@v8
        with:
          name: swift-artifactbundle
      - name: Set Up Swift
        uses: compnerd/gha-setup-swift@v0.5.0
        with:
          swift-version: swift-6.4.0-release
          swift-build: 6.4.0-RELEASE
          build_arch: ${{ matrix.arch }}
      - name: Test Swift
        run: swift test

  # The reusable workflow runs in another repository, so it fetches the artifact bundle through `gh`, with the token
  # and the `actions: read` permission this workflow grants.
  test_swift_android:
    name: Swift on Android
    needs: build_swift_artifacts
    uses: swiftlang/github-workflows/.github/workflows/swift_package_test.yml@fa1e46cf0f07ffde2de131e9ed5bd66a488c289c # main
    with:
      enable_linux_checks: false
      enable_windows_checks: false
      enable_android_sdk_build: true
      enable_android_sdk_checks: true
      needs_token: true
      linux_env_vars: STRINGZILLA_SWIFT_ARTIFACT=StringZillaC.artifactbundle.zip
      android_sdk_pre_build_command: gh run download ${{ github.run_id }} --repo ${{ github.repository }} --name swift-artifactbundle
      android_sdk_versions: '["6.4"]'

  test_swift_wasm:
    name: Swift on WebAssembly WASI
    needs: build_swift_artifacts
    runs-on: ubuntu-26.04
    container: swift:6.4
    env:
      STRINGZILLA_SWIFT_ARTIFACT: StringZillaC.artifactbundle.zip
    steps:
      - name: Checkout
        uses: actions/checkout@v7
      - name: Download Artifact Bundle
        uses: actions/download-artifact@v8
        with:
          name: swift-artifactbundle
      - name: Install Swift SDK for WebAssembly and Wasmtime
        run: |
          swift sdk install https://download.swift.org/swift-6.4.0-release/wasm-sdk/swift-6.4.0-RELEASE/swift-6.4.0-RELEASE_wasm.artifactbundle.tar.gz --checksum f07b7be3c586d92d7a07051fc6d303b87ebea67eadc40640ba59d5a8b79aa86d
          apt-get update && apt-get install -y curl xz-utils
          curl -fsSL https://wasmtime.dev/install.sh | bash
      - name: Build Library and Tests
        run: swift build --build-tests --swift-sdk swift-6.4.0-RELEASE_wasm
      - name: Test under Wasmtime
        run: ~/.wasmtime/bin/wasmtime run -S inherit-env=y --dir / .build/debug/StringZillaTests-test-runner.wasm --testing-library swift-testing

  test_windows:
    name: Windows - ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-2022
            arch: x64
          - os: windows-11-arm
            arch: arm64
    steps:
      - name: Checkout
        uses: actions/checkout@v7
      - name: Set up MSVC developer environment
        uses: ilammy/msvc-dev-cmd@v1
        with:
          arch: ${{ matrix.arch }}

      - name: Log hardware capabilities
        shell: powershell
        run: |
          Get-CimInstance -ClassName Win32_Processor | Select-Object Name, NumberOfCores, NumberOfLogicalProcessors, MaxClockSpeed | Format-List

      - name: Build C/C++
        shell: cmd
        run: |
          cmake --preset release

          cmake --build --preset release > build_release/logs.txt 2>&1 || (
            echo "Compilation failed. Here are the logs:"
            type build_release\logs.txt
            echo "The original compilation commands:"
            type build_release\compile_commands.json
            exit 1
          )
      - name: Test C++
        run: ctest --preset release
      - name: Test on Real World Data
        run: .\build_release\stringzilla_bench.exe
        env:
          STRINGWARS_DATASET: ./README.md
        # Don't overload GitHub with our benchmarks.
        # The results in such an unstable environment will be meaningless anyway.
        if: 0

        # Python
      - name: Set up Python ${{ env.PYTHON_VERSION }}
        uses: actions/setup-python@v7
        with:
          python-version: ${{ env.PYTHON_VERSION }}
      - name: Build Python
        run: |
          python -m pip install --upgrade pip
          python -m pip install --group test .
      - name: Test Python
        run: python -X faulthandler -m pytest -x

        # Rust, on nightly until 1.100 reaches stable, as `rust-version` rejects any older compiler
      - name: Set up Rust
        uses: dtolnay/rust-toolchain@nightly
      - name: Test Rust
        run: cargo test --release
      - name: Build Rust no_std
        run: cargo build --release --no-default-features

  test_alpine:
    name: Alpine Linux
    runs-on: ubuntu-26.04
    container:
      image: alpine:latest
      options: --privileged # If needed for certain Docker operations
    steps:
      # bash and curl are required by dtolnay/rust-toolchain
      - name: Install Git for checkout
        run: |
          apk add --no-cache git openssh ca-certificates bash curl
          git --version
      - name: Log Alpine and Git versions
        run: |
          echo "Alpine: $(cat /etc/alpine-release 2>/dev/null || echo 'unknown')"
          git --version || echo "git not installed"
      - name: Checkout
        uses: actions/checkout@v7

      - name: Log hardware capabilities
        run: |
          lscpu || true
          echo ""
          echo "CPU Info:"
          grep -E "model name|flags" /proc/cpuinfo | head -5 || true

        # C/C++
      - name: Build C/C++
        run: |
          apk add --update cmake samurai g++ gcc
          cmake --preset release
          cmake --build --preset release
      - name: Test C++
        run: ctest --preset release

        # Python
      - name: Build Python
        run: |
          apk add python3 py3-pip python3-dev
          python3 -m pip install --break-system-packages --upgrade pip
          python3 -m pip install --break-system-packages --group test .
      - name: Test Python
        run: python3 -X faulthandler -m pytest -x

        # Rust, on nightly until 1.100 reaches stable, as `rust-version` rejects any older compiler
      - name: Set up Rust
        uses: dtolnay/rust-toolchain@nightly
      - name: Test Rust
        run: cargo test --release
      - name: Test Rust no_std
        run: cargo test --release --no-default-features
  # Packaging surface - what a downstream distributor sees, not what our own build tree sees. The consumers
  # check spellings by linking them: an undefined name fails at generate time.
  test_packaging:
    name: CMake Packaging
    runs-on: ubuntu-26.04
    env:
      HEADER_PREFIX: ${{ github.workspace }}/prefix_header
      FULL_PREFIX: ${{ github.workspace }}/prefix_full
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Install build tools
        run: |
          sudo apt update
          sudo apt install -y cmake build-essential

      - name: Write the consumer sources
        run: |
          mkdir -p consumer
          cat > consumer/main.c <<'EOF'
          #include <stdio.h>
          #include <stringzilla/stringzilla.h>
          int main(void) {
              char const *haystack = "hello world";
              sz_cptr_t match = NULL;
          #if STRINGZILLA_HEADER_ONLY
              sz_find_serial(haystack, 11, "world", 5, &match, NULL);
          #else
              sz_capability_t capabilities = 0;
              sz_capabilities_enabled_cpu(&capabilities);
              sz_find_best(haystack, 11, "world", 5, &match, capabilities, NULL);
          #endif
              printf("%d\n", (int)(match - haystack));
              return match ? 0 : 1;
          }
          EOF

        # Every registry recipe depends on the smallest prefix, the headers and the archive, installing cleanly.
      - name: Install the header-only package
        run: |
          cmake -B build_header -DCMAKE_BUILD_TYPE=Release -DSTRINGZILLA_INSTALL=ON -DSTRINGZILLA_BUILD_SHARED=OFF \
            -DCMAKE_INSTALL_PREFIX="$HEADER_PREFIX"
          cmake --build build_header --parallel
          cmake --install build_header

      - name: Consume the header-only package
        run: |
          cat > consumer/CMakeLists.txt <<'EOF'
          cmake_minimum_required(VERSION 3.21)
          project(consumer C)
          find_package(stringzilla REQUIRED)
          add_executable(consumer main.c)
          target_link_libraries(consumer PRIVATE stringzilla::header)
          EOF
          cmake -S consumer -B consumer/build -DCMAKE_PREFIX_PATH="$HEADER_PREFIX"
          cmake --build consumer/build
          ./consumer/build/consumer

      - name: Install the compiled libraries
        run: |
          cmake -B build_full -DCMAKE_BUILD_TYPE=Release -DSTRINGZILLA_INSTALL=ON -DSTRINGZILLA_BUILD_SHARED=ON \
            -DCMAKE_INSTALL_PREFIX="$FULL_PREFIX"
          cmake --build build_full --parallel
          cmake --install build_full

        # The installed prefix must resolve the libraries' own exported targets.
      - name: Consume the compiled package
        run: |
          cat > consumer/CMakeLists.txt <<'EOF'
          cmake_minimum_required(VERSION 3.21)
          project(consumer C)
          find_package(stringzilla REQUIRED)
          add_executable(consumer_shared main.c)
          target_link_libraries(consumer_shared PRIVATE stringzilla::shared)
          add_executable(consumer_static main.c)
          target_link_libraries(consumer_static PRIVATE stringzilla::static)
          EOF
          rm -rf consumer/build
          cmake -S consumer -B consumer/build -DCMAKE_PREFIX_PATH="$FULL_PREFIX"
          cmake --build consumer/build
          LD_LIBRARY_PATH="$FULL_PREFIX/lib" ./consumer/build/consumer_shared
          ./consumer/build/consumer_static

        # The `.pc` exists for build systems CMake never reaches, so it is checked without CMake.
      - name: Consume via pkg-config
        run: |
          export PKG_CONFIG_PATH="$FULL_PREFIX/lib/pkgconfig"
          test "$(pkg-config --modversion stringzilla)" = "$(cat VERSION)"
          cc consumer/main.c $(pkg-config --cflags --libs stringzilla) -o consumer/pc_consumer
          LD_LIBRARY_PATH="$FULL_PREFIX/lib" ./consumer/pc_consumer

        # The in-tree aliases are a separate code path from the installed package's exported targets.
      - name: Consume via add_subdirectory
        run: |
          cat > consumer/CMakeLists.txt <<EOF
          cmake_minimum_required(VERSION 3.21)
          project(consumer C CXX)
          set(STRINGZILLA_BUILD_SHARED ON CACHE BOOL "" FORCE)
          add_subdirectory($GITHUB_WORKSPACE stringzilla_build)
          add_executable(consumer main.c)
          target_link_libraries(consumer PRIVATE stringzilla::header stringzilla::shared)
          EOF
          rm -rf consumer/build
          cmake -S consumer -B consumer/build
          cmake --build consumer/build --target consumer --parallel
          ./consumer/build/consumer

  # Native wheels - each runner's native arch (Linux pinned to x86_64; emulated arches in `build_wheels_emulated`).
  # windows-11-arm validates the Windows ARM64 wheel that release ships; ARM64 CPython is official from 3.11.
  build_wheels_native:
    name: Build Python ${{ matrix.python-version }} for ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    needs:
      [
        test_ubuntu_gcc,
        test_ubuntu_clang,
        test_macos,
        test_windows,
        test_cross_linux,
      ]
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-26.04, macos-15, windows-2022, windows-11-arm]
        python-version: ["310", "311", "312", "313", "314", "314t"]
        exclude:
          - os: windows-11-arm
            python-version: "310"
    steps:
      - name: Checkout
        uses: actions/checkout@v7
      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: 3.x
      - name: Install cibuildwheel
        run: python -m pip install cibuildwheel==3.4.1
      - name: Build wheels
        run: cibuildwheel --output-dir wheelhouse
        env:
          CIBW_BUILD: cp${{ matrix.python-version }}-*
          CIBW_ARCHS_LINUX: x86_64

  # Emulated Linux wheels - one arch per runner so no runner pulls every image; fuzz depth thinned under QEMU.
  build_wheels_emulated:
    name: Build Python wheels for ${{ matrix.arch }}
    runs-on: ubuntu-26.04
    needs:
      [
        test_ubuntu_gcc,
        test_ubuntu_clang,
        test_macos,
        test_windows,
        test_cross_linux,
      ]
    strategy:
      fail-fast: false
      matrix:
        arch: [aarch64, ppc64le, s390x, i686, armv7l, riscv64]
    steps:
      - name: Checkout
        uses: actions/checkout@v7
      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: 3.x
      - name: Setup QEMU
        uses: docker/setup-qemu-action@v4
      - name: Install cibuildwheel
        run: python -m pip install cibuildwheel==3.4.1
      - name: Build wheels
        run: cibuildwheel --output-dir wheelhouse
        env:
          CIBW_BUILD: "cp310-* cp311-* cp312-* cp313-* cp314-*"
          CIBW_ARCHS_LINUX: ${{ matrix.arch }}
          # QEMU_CPU drops the SVE kits, whose emulation is flaky; STRINGZILLA_SCALE matches `test_cross_qemu`.
          CIBW_ENVIRONMENT_LINUX: >-
            STRINGZILLA_IN_QEMU=1 STRINGZILLA_SCALE=0.05${{ matrix.arch == 'aarch64' && ' QEMU_CPU=max,sve=off' || '' }}
