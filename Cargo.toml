[package]
authors = ["Ash Vardanian <1983160+ashvardanian@users.noreply.github.com>"]
# Not `external-ffi-bindings`: that is for a library built elsewhere, and `c/` is vendored and built by `build.rs`.
categories = ["text-processing", "hardware-support", "no-std", "wasm"]
description = "Search, hash, sort, and fuzzy-match strings faster via SWAR, SIMD, and GPGPU"
documentation = "https://docs.rs/stringzilla"
edition = "2021"
homepage = "https://ashvardanian.com/posts/stringzilla/"
# Leading slashes anchor to the package root; Cargo matches these like gitignore.
include = [
  "/rust/**",
  "/build.rs",
  "/LICENSE",
  # Everything CMake reads to build the archive
  "/CMakeLists.txt",
  "/cmake/*",
  "/c/**",
  "/include/**",
  "/probes/*.c",
  "/VERSION",
]
keywords = ["simd", "search", "retrieval", "hash", "sort"]
license = "Apache-2.0"
# The bundled C sources export global `sz_*` symbols, so `links` makes Cargo refuse a graph holding two copies of this
# crate. It adds exclusivity to resolution only; the linking itself stays in `build.rs`.
links = "stringzilla"
name = "stringzilla"
publish = true
repository = "https://github.com/ashvardanian/StringZilla"
# `UnifiedAllocator` implements the standard `Allocator`, stable since 1.100.
rust-version = "1.100"
version = "5.1.2"

[lib]
name = "stringzilla"
path = "rust/lib.rs"

[features]
default = ["std"]
std = []
# The GPU backends, each added to the library CMake builds
cuda = ["std"]
metal = ["std"]
rocm = ["std"]

[dependencies]

[build-dependencies]
cmake = "0.1"

# Third-party oracles the `#[cfg(test)]` suites differential against. Dev-dependencies rather than an
# optional feature, so they never reach a consumer's build graph, never appear on docs.rs, and never
# become public surface this crate has to keep. `aho-corasick` is the reference multi-pattern
# automaton, whose three `MatchKind`s are our three overlap policies under different names.
[dev-dependencies]
aho-corasick = "1.1"

[lints.clippy]
# Catch platform-specific type issues like `c_char` differences
cast_sign_loss = "warn"
# Catch potential FFI issues
not_unsafe_ptr_arg_deref = "warn"
# Catch transmute issues
transmute_ptr_to_ptr = "warn"

[lints.rust]
# Catch ABI mismatches in FFI
improper_ctypes = "warn"
# Catch platform-specific code that might fail on other targets
unexpected_cfgs = "warn"
